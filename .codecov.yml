# Codecov (https://codecov.io): coverage from CI's Go and Web jobs, shown by the README's coverage badge.
coverage:
  status:
    # The overall figure must stay at 95% (CI checks the same minimum for Go and in Vitest for web); a pull request's own lines are reported, not enforced.
    project:
      default:
        target: 95%
    patch:
      default:
        informational: true

flags:
  go:
    paths:
      - cmd/
      - internal/
    carryforward: true
  web:
    paths:
      - web/src/
    carryforward: true

# Generated code, test helpers and the entry points that only hand over to tested code aren't Encore's code to test. .github/scripts/go-coverage.sh reads this list too, and web/vite.config.ts's coverage.exclude matches its web entries.
ignore:
  - "**/*.gen.go"
  - "cmd/encore/main.go"
  - "internal/backend/kodi/kodirpc/"
  - "internal/backend/kodi/fakekodi/"
  - "internal/smapi/smapiclient/"
  - "internal/smapi/smapitest/"
  - "internal/auth/oidctest/"
  - "internal/blobstore/blobstoretest/"
  - "internal/testkit/"
  - "web/src/api/generated/"
  - "web/src/dev/"
  - "web/src/main.tsx"
  - "web/src/mocks/"
  - "web/src/routeTree.gen.ts"
  - "web/src/test/"

comment:
  layout: "condensed_header, diff, flags"
  require_changes: true
