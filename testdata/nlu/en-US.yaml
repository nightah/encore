# NLU checks for en-US: run them with make nlu (see internal/smapi/nlu). Each row is an utterance, the intent Alexa should pick and the slots it should fill; an empty slot value takes any words, and a value of a custom type may be its ID. Mark a row pending, with why, while the model that makes it pass isn't deployed yet.
locale: en-US
cases:
  # Every intent, in model order, in the language's own words.
  - {utterance: "cancel", intent: AMAZON.CancelIntent}
  - {utterance: "help", intent: AMAZON.HelpIntent}
  - {utterance: "stop", intent: AMAZON.StopIntent}
  - {utterance: "go home", intent: AMAZON.NavigateHomeIntent}
  - {utterance: "purple elephants dancing on the moon", intent: AMAZON.FallbackIntent}
  - {utterance: "pause the tv", intent: AMAZON.PauseIntent}
  - {utterance: "resume the tv", intent: AMAZON.ResumeIntent}
  - {utterance: "next", intent: AMAZON.NextIntent}
  - {utterance: "previous", intent: AMAZON.PreviousIntent}
  - {utterance: "start over", intent: AMAZON.StartOverIntent}
  - {utterance: "yes", intent: AMAZON.YesIntent}
  - {utterance: "no", intent: AMAZON.NoIntent}
  - {utterance: "shuffle on", intent: AMAZON.ShuffleOnIntent}
  - {utterance: "shuffle off", intent: AMAZON.ShuffleOffIntent}
  - {utterance: "loop on", intent: AMAZON.LoopOnIntent}
  - {utterance: "loop off", intent: AMAZON.LoopOffIntent}
  - {utterance: "i want to watch the movie dune", intent: WatchMovie, slots: {Movie: "dune"}}
  - {utterance: "continue watching breaking bad", intent: WatchNextEpisode, slots: {Show: "breaking bad"}}
  - {utterance: "find dune", intent: PlayMedia, slots: {Query: "dune"}}
  - {utterance: "the second one please", intent: ChooseMatch, slots: {Which: "second"}, pending: "ChooseMatch is in the model from the next deploy"}
  - {utterance: "pick a comedy movie for me", intent: WatchRandomMovie, slots: {Genre: ""}}
  - {utterance: "play the trailer", intent: WatchMovieTrailer}
  - {utterance: "continue the dune collection", intent: WatchNextInCollection, slots: {Movie: "dune"}}
  - {utterance: "play breaking bad episode 3 of season 2", intent: WatchEpisode, slots: {Episode: "3", Season: "2", Show: "breaking bad"}}
  - {utterance: "play breaking bad from the start", intent: WatchFirstEpisode, slots: {Show: "breaking bad"}}
  - {utterance: "play the latest breaking bad episode", intent: WatchLatestEpisode, slots: {Show: "breaking bad"}}
  - {utterance: "continue watching the last show", intent: ContinueWatching}
  - {utterance: "play an episode of breaking bad", intent: WatchRandomEpisode, slots: {Show: "breaking bad"}}
  - {utterance: "play any comedy show", intent: WatchRandomShow, slots: {Genre: ""}}
  - {utterance: "play breaking bad shuffled", intent: ShuffleShow, slots: {Show: "breaking bad"}}
  - {utterance: "binge watch breaking bad", intent: BingeShow, slots: {Show: "breaking bad"}}
  - {utterance: "play the artist queen", intent: ListenToArtist, slots: {Artist: "queen"}}
  - {utterance: "shuffle the artist queen", intent: ShuffleArtist, slots: {Artist: "queen"}}
  - {utterance: "play the album a night at the opera", intent: ListenToAlbum, slots: {Album: "a night at the opera"}}
  - {utterance: "shuffle the album a night at the opera", intent: ShuffleAlbum, slots: {Album: "a night at the opera"}}
  - {utterance: "play the latest album by queen", intent: ListenToLatestAlbum, slots: {Artist: "queen"}}
  - {utterance: "shuffle the latest album by queen", intent: ShuffleLatestAlbum, slots: {Artist: "queen"}}
  - {utterance: "play the song bohemian rhapsody", intent: ListenToSong, slots: {Song: "bohemian rhapsody"}}
  - {utterance: "play bohemian rhapsody by queen", intent: ListenToSongOrAlbum, slots: {Artist: "queen", Title: "bohemian rhapsody"}}
  - {utterance: "play the comedy genre", intent: ListenToGenre, slots: {Genre: ""}}
  - {utterance: "listen to my recently added songs", intent: ListenToRecentSongs}
  - {utterance: "let's party", intent: PartyMode}
  - {utterance: "play the music video for bohemian rhapsody", intent: WatchMusicVideo, slots: {MusicVideo: ""}}
  - {utterance: "play a comedy music video", intent: WatchRandomMusicVideo, slots: {Genre: ""}}
  - {utterance: "play all my comedy music videos", intent: ShuffleMusicVideos, slots: {Genre: ""}}
  - {utterance: "play the music playlist road trip", intent: PlayPlaylist, slots: {Playlist: ""}}
  - {utterance: "play the road trip playlist shuffled", intent: ShufflePlaylist, slots: {Playlist: ""}}
  - {utterance: "give me a movie recommendation", intent: Recommend, slots: {MediaType: "movie"}}
  - {utterance: "are there any new movie to watch", intent: WhatsNew, slots: {MediaType: "movie"}}
  - {utterance: "list the albums by queen", intent: WhatAlbums, slots: {Artist: "queen"}}
  - {utterance: "back five minutes", intent: PlayerSeek, slots: {Duration: "", SeekDirection: "back"}}
  - {utterance: "rewind by five minutes", intent: PlayerRewind, slots: {Duration: ""}}
  - {utterance: "go to the five minutes mark", intent: PlayerSeekTo, slots: {Position: ""}}
  - {utterance: "loop mode all", intent: Repeat, slots: {RepeatMode: "all"}}
  - {utterance: "enhance", intent: PlayerZoom}
  - {utterance: "rotate clockwise", intent: PlayerRotate, slots: {Rotation: "clockwise"}}
  - {utterance: "move the picture down", intent: PlayerMove, slots: {Direction: "down"}}
  - {utterance: "exit fullscreen", intent: Fullscreen}
  - {utterance: "stereoscopic mode", intent: StereoscopicMode}
  - {utterance: "toggle digital audio", intent: AudioPassthrough}
  - {utterance: "set the volume to 30", intent: VolumeSet, slots: {Level: "30"}}
  - {utterance: "louder", intent: VolumeUp}
  - {utterance: "lower the volume", intent: VolumeDown}
  - {utterance: "mute", intent: Mute}
  - {utterance: "what am i watching", intent: CurrentPlayItemEnquiry}
  - {utterance: "how long is left on this", intent: CurrentPlayItemTimeRemaining}
  - {utterance: "identify this echo", intent: IdentifyEcho}
  - {utterance: "next the subtitles", intent: Subtitles, slots: {SubtitleAction: "next"}}
  - {utterance: "next audio", intent: AudioStream, slots: {Step: "next"}}
  - {utterance: "go back", intent: Navigate, slots: {NavAction: "back"}}
  - {utterance: "enter the text hello", intent: TypeText, slots: {Text: ""}}
  - {utterance: "show the movies", intent: ViewLibrary, slots: {Section: "movies"}}
  - {utterance: "show the music playlist road trip", intent: ViewPlaylist, slots: {Playlist: ""}}
  - {utterance: "open my favourite bbc news", intent: OpenFavourite, slots: {Favourite: ""}}
  - {utterance: "launch youtube", intent: LaunchAddon, slots: {Addon: ""}}
  - {utterance: "do a global search for dune", intent: GlobalSearch, slots: {Query: "dune"}}
  - {utterance: "hibernate kodi", intent: Power, slots: {PowerAction: "hibernate"}}
  - {utterance: "eject", intent: EjectMedia}
  - {utterance: "look for new movies", intent: UpdateLibrary}
  - {utterance: "clean up the library", intent: CleanLibrary}
  # Answers to "did you mean …?".
  - {utterance: "yes please", intent: AMAZON.YesIntent}
  - {utterance: "no thanks", intent: AMAZON.NoIntent}
  - {utterance: "i meant the older one", intent: ChooseMatch, slots: {Which: "older"}, pending: "ChooseMatch is in the model from the next deploy"}
  # Bare titles, which free-text and title slots compete for.
  - {utterance: "play dune", intent: PlayMedia, slots: {Query: "dune"}}
  - {utterance: "put on dune", intent: PlayMedia, slots: {Query: "dune"}}
  # Rooms.
  - {utterance: "play the movie dune in the living room", intent: WatchMovie, slots: {Movie: "dune", Room: ""}}
  - {utterance: "continue watching breaking bad in the living room", intent: WatchNextEpisode, slots: {Room: "", Show: "breaking bad"}}
  - {utterance: "play some music by queen in the living room", intent: ListenToArtist, slots: {Artist: "queen", Room: ""}}
  - {utterance: "pause in the living room", intent: RoomControl, slots: {Command: "pause", Room: ""}}
  - {utterance: "pause the tv in the living room", intent: RoomControl, slots: {Command: "pause", Room: ""}}
  # Episodes and seasons, including the one-shot forms.
  - {utterance: "play breaking bad season 2 episode 3", intent: WatchEpisode, slots: {Episode: "3", Season: "2", Show: "breaking bad"}}
  - {utterance: "play season 2 episode 3 of breaking bad", intent: WatchEpisode, slots: {Episode: "3", Season: "2", Show: "breaking bad"}}
  - {utterance: "play breaking bad season 2 episode 3 in the living room", intent: WatchEpisode, slots: {Episode: "3", Room: "", Season: "2", Show: "breaking bad"}}
  - {utterance: "play the next episode of breaking bad", intent: WatchNextEpisode, slots: {Show: "breaking bad"}}
  - {utterance: "play the latest episode of breaking bad", intent: WatchLatestEpisode, slots: {Show: "breaking bad"}}
  - {utterance: "play the very first episode of breaking bad", intent: WatchFirstEpisode, slots: {Show: "breaking bad"}}
  - {utterance: "play first episode of breaking bad", intent: WatchFirstEpisode, slots: {Show: "breaking bad"}}
  # Music by an artist, including the one-shot forms.
  - {utterance: "play some music by queen", intent: ListenToArtist, slots: {Artist: "queen"}}
  - {utterance: "play the song bohemian rhapsody by queen", intent: ListenToSong, slots: {Artist: "queen", Song: "bohemian rhapsody"}}
  - {utterance: "play the album a night at the opera by queen", intent: ListenToAlbum, slots: {Album: "a night at the opera", Artist: "queen"}}
  - {utterance: "shuffle some music by queen", intent: ShuffleArtist, slots: {Artist: "queen"}}
