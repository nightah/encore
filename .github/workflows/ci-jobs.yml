name: CI jobs

# Called by ci.yml for each push here and each pull request from a fork.
#
# Encore is built once, by the Build job, for every platform; E2E, the arm64 smoke test and the test image all use those binaries.
#
# Go caches are only saved from main, one per purpose (go-test for the race-enabled tests, go-build for the release builds), and only when go.mod or go.sum changed. Branches and forks restore main's, so they never write their own: each is over 500 MB, and per-branch copies pushed the repository past GitHub's 10 GB cache limit.
on:
  workflow_call:

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the code
      id-token: write # upload coverage to Codecov without a token (OIDC)
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore the Go cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum') }}
          restore-keys: go-test-${{ runner.os }}-${{ runner.arch }}-

      - name: golangci-lint (root module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      # tools/ is a separate Go module, so golangci-lint run from the root does not descend into it. Lint it as its own module with the same config.
      - name: golangci-lint (tools module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: tools
          args: --config=../.golangci.yml

      - name: Check generated code is up to date
        run: |
          go generate ./...
          if ! git diff --exit-code; then
            echo "::error::Generated code is stale. Run 'make generate' and commit the result."
            exit 1
          fi
          untracked="$(git status --porcelain --untracked-files=all)"
          if [ -n "${untracked}" ]; then
            echo "::error::go generate produced untracked files:"
            echo "${untracked}"
            exit 1
          fi

      - name: Test
        # -coverpkg credits code to whichever package's tests run it, so code tested through its callers counts.
        run: go test -race -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            {
              echo "### Go coverage"
              echo
              echo '```'
              go tool cover -func=coverage.out | tail -n 1
              echo '```'
              echo
              echo "<details><summary>Per-function coverage</summary>"
              echo
              echo '```'
              go tool cover -func=coverage.out
              echo '```'
              echo "</details>"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      # .codecov.yml leaves out generated code and test helpers. Forks' pull requests can't get an OIDC token, so a failed upload doesn't fail CI.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          flags: go
          use_oidc: true
          fail_ci_if_error: false

      - name: Lint interaction models
        run: go run ./cmd/encore gen lint

      - name: Build (noui)
        run: go build -tags noui ./...

      - name: Save the Go cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.cache.outputs.cache-primary-key }}

  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # govulncheck loads every package of both modules, which the Go job's cache holds.
      - name: Restore the Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum') }}
          restore-keys: go-test-${{ runner.os }}-${{ runner.arch }}-

      # Reads the pnpm version from the "packageManager" field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      # actionlint, editorconfig-checker and govulncheck run from the tools module, which pins their versions; the rest are pinned here.
      - name: actionlint
        run: go tool -modfile=tools/go.mod actionlint

      - name: editorconfig-checker
        run: git ls-files -z | xargs -0 go tool -modfile=tools/go.mod editorconfig-checker

      - name: govulncheck
        run: go tool -modfile=tools/go.mod govulncheck ./...

      - name: hadolint
        run: |
          for f in Dockerfile Dockerfile.goreleaser; do
            docker run --rm -i hadolint/hadolint:v2.15.1 hadolint - < "$f"
          done

      # Only what ships: Encore's go.mod and the web interface's production dependencies. Build and test tooling is left out; see .osv-scanner.toml.
      - name: osv-scanner
        run: |
          pnpm -C web sbom --sbom-format cyclonedx --prod --lockfile-only > "${RUNNER_TEMP}/web.cdx.json"
          docker run --rm -v "$PWD:/repo:ro" -v "${RUNNER_TEMP}:/sbom:ro" -w /repo ghcr.io/google/osv-scanner:v2.7.0 \
            scan source --config .osv-scanner.toml -L go.mod -L /sbom/web.cdx.json

      # Preinstalled on GitHub's Ubuntu runners.
      - name: shellcheck
        run: shellcheck --format=gcc docker/root/etc/s6-overlay/s6-rc.d/encore/run docker/root/etc/s6-overlay/scripts/adduser docker/root/etc/s6-overlay/scripts/encoresetup .github/scripts/*.sh

      - name: trufflehog
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo trufflesecurity/trufflehog:3.99.7 --fail --no-update --log-level=-1 filesystem -x .trufflehog .

      - name: typos
        run: pipx run typos==1.51.1 --format brief

      - name: yamllint
        run: pipx run yamllint==1.38.0 --strict --format github .

      - name: zizmor
        run: pipx run zizmor==1.31.1 --no-progress --format github .github/workflows

      - name: Image scripts
        run: |
          .github/scripts/image-delete-untagged_test.sh
          .github/scripts/image-superseded_test.sh
          .github/scripts/image-tag_test.sh

      - name: Next version script
        run: .github/scripts/next-version_test.sh

      # Needs pnpm and node for the package.json edits.
      - name: Release version script
        run: .github/scripts/release-version_test.sh

  tools:
    name: Tools module
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache: false

      - name: Restore the Go cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/go.mod', 'tools/go.sum') }}
          restore-keys: go-tools-${{ runner.os }}-${{ runner.arch }}-

      - name: Test
        run: go test ./...

      - name: Save the Go cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.cache.outputs.cache-primary-key }}

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
      id-token: write # upload coverage to Codecov without a token (OIDC)
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from the "packageManager" field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm -C web install --frozen-lockfile

      - name: Check the generated API client is up to date
        run: |
          pnpm -C web generate:api
          if ! git diff --exit-code -- web/src/api/generated; then
            echo "::error::The API client is stale. Run 'pnpm -C web generate:api' and commit the result."
            exit 1
          fi
          untracked="$(git status --porcelain --untracked-files=all -- web/src/api/generated)"
          if [ -n "${untracked}" ]; then
            echo "::error::generate:api produced untracked files:"
            echo "${untracked}"
            exit 1
          fi

      - name: Lint
        run: pnpm -C web lint

      - name: Typecheck
        run: pnpm -C web typecheck

      - name: Test
        run: pnpm -C web test:coverage

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: web/coverage/lcov.info
          flags: web
          use_oidc: true
          fail_ci_if_error: false

      - name: Build
        run: pnpm -C web build

      - name: Upload SPA bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: internal/server/dist
          if-no-files-found: error
          retention-days: 7

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The build generates the configuration, CLI and voice command reference pages from the Go code and i18n/ first.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore the Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-build-${{ runner.os }}-${{ runner.arch }}-

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: docs/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install
        run: pnpm -C docs install --frozen-lockfile

      - name: Lint
        run: pnpm -C docs lint

      # Also validates every internal link and anchor (starlight-links-validator).
      - name: Build
        run: pnpm -C docs build

  # Cross-compiles Encore for every platform the images and releases ship (pure Go, CGO off), plus the fake Kodi E2E runs against. Stamped with the image tag when this run publishes a test image, so the web interface shows it.
  build:
    name: Build
    needs: [web]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      image-tag: ${{ steps.version.outputs.image-tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # A pull request's checkout is a merge commit; its first parent is the base, which the Version step diffs against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore the Go cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Download SPA bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: internal/server/dist

      # Main's image is tagged main and reports main-<short commit> as its version. A branch here gets an image under its name (.github/scripts/image-tag.sh), a fork's pull request one as PR<number>; Renovate's branches get none, and nor does a change that only touches docs/, since its image would be the same as the one it's based on.
      - name: Version
        id: version
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=""
          version=""
          commit="${GITHUB_SHA}"
          # The comparison lists at most 300 files; a change that big isn't docs-only.
          compare() { gh api "repos/${GITHUB_REPOSITORY}/compare/$1...${GITHUB_SHA}" --jq 'if (.files | length) < 300 then .files[].filename else "many" end'; }
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            tag="PR${PR}"
            commit="${HEAD_SHA}"
            files="$(git diff --name-only HEAD^1 HEAD)"
          elif [ "${GITHUB_REF}" = refs/heads/main ]; then
            tag=main
            version="main-${GITHUB_SHA::7}"
            # What this push merged; a new branch's before is all zeros.
            files="$(compare "${BEFORE}" 2> /dev/null)" || files=""
          else
            tag="$(.github/scripts/image-tag.sh "${GITHUB_REF_NAME}")" || tag=""
            files="$(compare main)"
          fi
          if [ -n "${tag}" ] && [ -n "${files}" ] && ! grep -qv '^docs/' <<< "${files}"; then
            echo "::notice::Only docs/ changed; no test image"
            tag=""
          fi
          {
            echo "image-tag=${tag}"
            echo "version=${version:-${tag:-0.0.0-ci}}"
            echo "commit=${commit}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          pkg=github.com/nightah/encore/internal/buildinfo
          ldflags="-s -w -X ${pkg}.Version=${VERSION} -X ${pkg}.Commit=${COMMIT} -X ${pkg}.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export CGO_ENABLED=0
          for platform in linux/amd64 linux/arm64 linux/arm/v7; do
            IFS=/ read -r os arch variant <<< "${platform}"
            GOOS="${os}" GOARCH="${arch}" GOARM="${variant#v}" go build -trimpath -ldflags "${ldflags}" -o "dist/${platform}/encore" ./cmd/encore
          done
          go build -trimpath -o dist/fakekodi ./internal/backend/kodi/fakekodi/cmd/fakekodi
          file dist/linux/amd64/encore dist/linux/arm64/encore dist/linux/arm/v7/encore

      - name: Smoke test (linux/amd64)
        run: dist/linux/amd64/encore version

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist
          if-no-files-found: error
          retention-days: 1

      - name: Save the Go cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # E2E runs the amd64 binary for real; this checks the arm64 one starts. GitHub's arm runners can't run 32-bit binaries, so armv7 is only built.
  smoke:
    name: Smoke linux/arm64
    needs: [build]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist

      # Artifacts don't keep the executable bit.
      - name: Smoke test
        run: |
          chmod +x dist/linux/arm64/encore
          dist/linux/arm64/encore version

  e2e:
    name: E2E (Playwright)
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist

      # Artifacts don't keep the executable bit.
      - name: Make the binaries executable
        run: chmod +x dist/linux/amd64/encore dist/fakekodi

      - name: Install web dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Install Playwright (chromium only)
        run: pnpm -C web exec playwright install chromium

      # Starts the fake Kodi and Encore on a fresh data directory (web/e2e/real/global-setup.ts).
      - name: Run Playwright against the real server
        env:
          E2E_SERVER_LOG: "1"
          # Use the Build job's binaries rather than building them in the global setup.
          E2E_ENCORE_BIN: dist/linux/amd64/encore
          E2E_FAKEKODI_BIN: dist/fakekodi
        run: pnpm -C web exec playwright test

      - name: Run Playwright against the mock API
        env:
          E2E_MOCK: "1"
        run: pnpm -C web exec playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Packs the Build job's binaries into a test image for linux/amd64, linux/arm64 and linux/arm/v7 with Dockerfile.goreleaser, as releases do, and keeps it as an artifact. The job has no write access and no secrets, so it can run a fork's code; "Publish images" (images-publish.yml) pushes the artifact to ghcr.io/nightah/encore once this run passes, after a maintainer approves a fork's.
  image:
    name: Image
    needs: [build]
    if: needs.build.outputs.image-tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}/context

      # Dockerfile.goreleaser copies <platform>/encore and docker/root from its context.
      - name: Prepare the build context
        run: |
          rm "${RUNNER_TEMP}/context/fakekodi"
          cp -R docker "${RUNNER_TEMP}/context/"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The runtime stage only copies files, so no emulation is needed.
      - name: Build
        env:
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p "${RUNNER_TEMP}/image"
          docker buildx build \
            --platform linux/amd64,linux/arm64,linux/arm/v7 \
            --file Dockerfile.goreleaser \
            --label version="${VERSION}" \
            --label build_date="${created}" \
            --label org.opencontainers.image.title=encore \
            --label org.opencontainers.image.description="Self-hosted Alexa skill server for Kodi" \
            --label org.opencontainers.image.url=https://github.com/nightah/encore \
            --label org.opencontainers.image.source=https://github.com/nightah/encore \
            --label org.opencontainers.image.licenses=Apache-2.0 \
            --label org.opencontainers.image.version="${VERSION}" \
            --label org.opencontainers.image.revision="${COMMIT}" \
            --label org.opencontainers.image.created="${created}" \
            --provenance=false \
            --output "type=oci,dest=${RUNNER_TEMP}/image/image.tar" \
            "${RUNNER_TEMP}/context"

      - name: Upload image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image/image.tar
          if-no-files-found: error
          retention-days: 3
