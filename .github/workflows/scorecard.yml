---
# OpenSSF Scorecard: rates the repository's supply-chain practices, publishes the score to scorecard.dev for the README badge, and uploads the findings to code scanning under the Security tab.
name: Scorecard

on:
  # A change to classic branch protection re-scores the Branch-Protection check. Repository rulesets have no workflow trigger, so a ruleset change is picked up by the next push to main or the weekly run.
  branch_protection_rule: {}
  push:
    branches: [main]
  schedule:
    # Weekly, so the score keeps up with checks that change without a commit (Maintained, Vulnerabilities).
    - cron: '39 14 * * 0'
  workflow_dispatch: {}

permissions: {}

jobs:
  # Publishing to scorecard.dev only accepts runs on the default branch from a job with no run steps or containers, using only the approved actions below.
  analysis:
    name: Analysis
    if: github.event.repository.default_branch == github.ref_name
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # sign the published results with an OIDC token
      security-events: write # upload the results to code scanning
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyse
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the results as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
          category: scorecard
