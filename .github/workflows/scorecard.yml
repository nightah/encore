---
# OpenSSF Scorecard: rates the repository's supply-chain practices, publishes the score to scorecard.dev for the README badge, and uploads the findings to code scanning under the Security tab.
name: Scorecard

on:
  # Branch protection and rulesets feed the Branch-Protection check, so a change to them re-scores.
  branch_protection_rule: {}
  push:
    branches: [main]
  schedule:
    # Weekly, so the score keeps up with checks that change without a commit (Maintained, Vulnerabilities).
    - cron: '39 14 * * 0'
  workflow_dispatch: {}

permissions: {}

jobs:
  # Publishing to scorecard.dev only accepts runs on the default branch from a job with no run steps or containers, using only the approved actions below.
  analysis:
    name: Analysis
    if: github.event.repository.default_branch == github.ref_name
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
      id-token: write # sign the published results with an OIDC token
      security-events: write # upload the results to code scanning
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyse
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the results as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
