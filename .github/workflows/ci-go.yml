name: Go

# The Go jobs of ci-jobs.yml, called from it as "Go", so their checks read "Pipeline / Go / …". Lint, the two race-detector test shards and the phonetic evaluation's five shards run side by side; Coverage merges the test shards' profiles, uploads them to Codecov and holds the minimum, and Phonetic evaluation requires every phonetic shard.
on:
  workflow_call:

permissions: {}

env:
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore the Go cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum') }}
          restore-keys: go-lint-${{ runner.os }}-${{ runner.arch }}-

      - name: golangci-lint (root module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      # tools/ is a separate Go module, so golangci-lint run from the root does not descend into it. Lint it as its own module with the same config.
      - name: golangci-lint (tools module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: tools
          args: --config=../.golangci.yml

      - name: Check generated code is up to date
        run: |
          go generate ./...
          if ! git diff --exit-code; then
            echo "::error::Generated code is stale. Run 'make generate' and commit the result."
            exit 1
          fi
          untracked="$(git status --porcelain --untracked-files=all)"
          if [ -n "${untracked}" ]; then
            echo "::error::go generate produced untracked files:"
            echo "${untracked}"
            exit 1
          fi

      - name: Lint interaction models
        run: go run ./cmd/encore gen lint

      - name: Build (noui)
        run: go build -tags noui ./...

      - name: Save the Go cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.cache.outputs.cache-primary-key }}

  test:
    name: Test (${{ matrix.shard }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the code
    strategy:
      fail-fast: false
      matrix:
        # The matcher's tests take as long as every other package's together, so each shard gets a runner of its own.
        shard: [matcher, others]
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore the Go cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum') }}
          restore-keys: go-test-${{ runner.os }}-${{ runner.arch }}-

      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
        # -coverpkg credits code to whichever package's tests run it, so code tested through its callers counts. Each shard instruments every package, and Coverage merges the two profiles.
        run: |
          matcher=github.com/nightah/encore/internal/core/match
          if [ "${SHARD}" = matcher ]; then
            packages="${matcher}"
          else
            packages="$(go list ./... | grep -vx "${matcher}")"
          fi
          # shellcheck disable=SC2086 # one argument per package
          go test -race -coverpkg=./... -coverprofile="coverage-${SHARD}.out" -covermode=atomic ${packages}

      - name: Keep the coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.out
          retention-days: 1
          if-no-files-found: error

      - name: Save the Go cache
        if: github.ref == 'refs/heads/main' && matrix.shard == 'others' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # Runs even when a shard fails, and fails then itself: a required check that is skipped counts as passing.
  coverage:
    name: Coverage
    needs: [test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the code
      id-token: write # upload coverage to Codecov without a token (OIDC)
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore the Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum') }}
          restore-keys: go-test-${{ runner.os }}-${{ runner.arch }}-

      - name: Require both test shards
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [ "${RESULT}" != success ]; then
            echo "::error::A test shard did not pass (${RESULT})."
            exit 1
          fi

      - name: Fetch the coverage profiles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: go-coverage-*
          merge-multiple: true

      # A profile holds one mode line, then blocks; blocks both shards report are kept twice, which go tool cover and go-coverage.sh both merge.
      - name: Merge the coverage profiles
        run: |
          {
            head -n 1 coverage-matcher.out
            tail -q -n +2 coverage-matcher.out coverage-others.out
          } > coverage.out

      - name: Coverage summary
        run: |
          if [ -f coverage.out ]; then
            {
              echo "### Go coverage"
              echo
              echo '```'
              .github/scripts/go-coverage.sh coverage.out
              echo '```'
              echo
              echo "<details><summary>Per-function coverage</summary>"
              echo
              echo '```'
              go tool cover -func=coverage.out
              echo '```'
              echo "</details>"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      # .codecov.yml leaves out generated code and test helpers. Forks' pull requests can't get an OIDC token, so a failed upload doesn't fail CI.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          flags: go
          use_oidc: true
          fail_ci_if_error: false

      # The same figure Codecov shows (its ignore list applies), checked after the upload so a drop is still reported there.
      - name: Coverage minimum
        run: .github/scripts/go-coverage.sh coverage.out 97

  # The matcher's accuracy is gated here, on every push and pull request, so a regression fails the change that causes it rather than a later nightly. The matcher shard runs TestPhoneticEval with only what its gates need, which holds production to its floors on the grown corpora. This job runs TestPhoneticEval in full and TestPhoneticDistractors, which holds production's wrong plays for titles a library doesn't have to their ceilings. Both are too slow under the race detector, which has little to find in tests that run one search at a time, so they sit behind a build tag and run here without -race.
  phonetic-shards:
    name: Phonetic evaluation (${{ matrix.shard }}/5)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
    strategy:
      fail-fast: false
      matrix:
        # TestPhoneticDistractors searches every language's libraries one after another, so its languages are split across runners: shard k runs the languages whose index in Languages() leaves k-1 over when divided by 5 (ENCORE_MATCH_SHARD).
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore the Go cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum') }}
          restore-keys: go-test-${{ runner.os }}-${{ runner.arch }}-

      - name: Phonetic distractors
        env:
          ENCORE_MATCH_SHARD: ${{ matrix.shard }}/5
        run: go test -tags phoneticeval -count=1 -run 'TestPhoneticDistractors' ./internal/core/match/

      - name: Phonetic evaluation
        if: matrix.shard == 1
        run: go test -tags phoneticeval -count=1 -run 'TestPhoneticEval' ./internal/core/match/

  # The required check: runs even when a shard fails, and fails then itself, since a required check that is skipped counts as passing.
  phonetic:
    name: Phonetic evaluation
    needs: [phonetic-shards]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every phonetic shard
        env:
          RESULT: ${{ needs.phonetic-shards.result }}
        run: |
          if [ "${RESULT}" != success ]; then
            echo "::error::A phonetic evaluation shard did not pass (${RESULT})."
            exit 1
          fi
