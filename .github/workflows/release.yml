name: Release

# Pushing a vX.Y.Z tag releases that commit: tag the merged "release: vX.Y.Z" commit, whose package.json versions must match (make version VERSION=X.Y.Z).
on:
  push:
    tags: ['v*.*.*']

# Never cancel a release mid-flight; queue instead.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Check the version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches the stamped version
        run: |
          want="${GITHUB_REF_NAME#v}"
          for f in web/package.json docs/package.json; do
            got="$(jq -r .version "$f")"
            if [ "$got" != "$want" ]; then
              echo "::error file=$f::version is $got, but the tag is $GITHUB_REF_NAME. Run 'make version VERSION=$want' in the release commit."
              exit 1
            fi
          done

  web:
    name: Build web
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          # No dependency cache on release builds (cache-poisoning hardening).
          package-manager-cache: false

      - name: Install
        run: pnpm -C web install --frozen-lockfile

      - name: Build
        run: pnpm -C web build

      - name: Upload SPA bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: internal/server/dist
          if-no-files-found: error
          retention-days: 1

  goreleaser:
    name: GoReleaser
    needs: [verify, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # create the release and upload its assets
      packages: write # push to GHCR
    outputs:
      hashes: ${{ steps.subjects.outputs.hashes }}
      digest: ${{ steps.subjects.outputs.digest }}
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download SPA bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: internal/server/dist

      # GoReleaser refuses to run on a dirty tree, untracked files included. .gitignore already covers the SPA bundle; this keeps the release working if it ever stops doing so.
      - name: Ignore downloaded SPA bundle for git
        run: |
          printf '%s\n' 'internal/server/dist/*' '!internal/server/dist/.gitkeep' >> .git/info/exclude
          git status --porcelain

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # What the provenance covers: every archive by its SHA-256, and the multi-arch image by its digest.
      - name: Provenance subjects
        id: subjects
        run: |
          echo "hashes=$(base64 -w0 dist/checksums.txt)" >> "${GITHUB_OUTPUT}"
          digest="$(awk 'NR==1 {print $1}' dist/digests.txt)"
          case "${digest}" in sha256:*) ;; *) digest="sha256:${digest}" ;; esac
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

  # SLSA Build Level 3 provenance from slsa-github-generator's isolated reusable workflows, signed with Sigstore. They're pinned to a commit SHA like every other action; compile-generator builds the generator from that source instead of downloading the release binary, which is what lets slsa-verifier accept a SHA-pinned reference. Verify an archive with `slsa-verifier verify-artifact --provenance-path encore.intoto.jsonl --source-uri github.com/nightah/encore <archive>`, and the image with `slsa-verifier verify-image ghcr.io/nightah/encore@<digest> --source-uri github.com/nightah/encore`.
  provenance-archives:
    name: Provenance (archives)
    needs: goreleaser
    permissions:
      actions: read # read the workflow run for the provenance
      id-token: write # sign the provenance with Sigstore (OIDC)
      contents: write # attach encore.intoto.jsonl to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      provenance-name: encore.intoto.jsonl
      upload-assets: true
      compile-generator: true

  provenance-image:
    name: Provenance (image)
    needs: goreleaser
    permissions:
      actions: read # read the workflow run for the provenance
      id-token: write # sign the provenance with Sigstore (OIDC)
      packages: write # push the attestation next to the image on GHCR
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      image: ghcr.io/nightah/encore
      digest: ${{ needs.goreleaser.outputs.digest }}
      registry-username: ${{ github.actor }}
      compile-generator: true
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
