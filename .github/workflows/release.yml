name: Release

# Pushing a vX.Y.Z tag releases that commit: tag the merged "release: vX.Y.Z" commit, whose package.json versions must match (make version VERSION=X.Y.Z).
on:
  push:
    tags: ['v*.*.*']

# Never cancel a release mid-flight; queue instead.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Check the version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches the stamped version
        run: |
          want="${GITHUB_REF_NAME#v}"
          for f in web/package.json docs/package.json; do
            got="$(jq -r .version "$f")"
            if [ "$got" != "$want" ]; then
              echo "::error file=$f::version is $got, but the tag is $GITHUB_REF_NAME. Run 'make version VERSION=$want' in the release commit."
              exit 1
            fi
          done

  # Builds, publishes and attests the release in a reusable workflow, so the provenance names it as the signer (SLSA Build Level 3). The permissions are the most its jobs may use; each job takes only what it needs.
  build:
    name: Build
    needs: verify
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    uses: $/.github/workflows/release-slsa.yml
