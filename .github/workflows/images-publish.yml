name: Publish images

# Pushes the test image a CI run built (the Image job in ci-jobs.yml) to ghcr.io/nightah/encore and says so on the pull request. It runs from the default branch, never the pull request's code: the image is only copied to the registry, not run. Main is published as main, and a branch here straight away under its name (fix/abc becomes fix-abc, .github/scripts/image-tag.sh); a pull request from a fork waits for a maintainer to approve the pr-images environment and is published as PR<number>.
#
# A tag only moves forward: a run whose commit is no longer the branch's or pull request's head isn't published. The image a tag moved off is deleted, as the registry would otherwise keep it, untagged, forever.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # A branch is usually pushed, and its image published, before its pull request is opened, so opening one also comments.
  pull_request_target: # zizmor: ignore[dangerous-triggers] only the base branch is checked out, and nothing from the pull request runs
    types: [opened, reopened]

permissions: {}

jobs:
  resolve:
    name: Resolve the tag
    # Same-repository pull requests' runs are skipped, and have no image.
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
      (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name != github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # check the run built an image
      contents: read # check out the default branch for image-tag.sh
      pull-requests: read # find the run's pull requests
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prs: ${{ steps.tag.outputs.prs }}
      fork: ${{ steps.tag.outputs.fork }}
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CI builds no image for Renovate's branches or for changes to docs/ alone. A fork's run lists no pull requests (workflow_run.pull_requests is empty for forks), so its pull request is looked up by head branch and must still be at the commit that was built.
      - name: Resolve the tag and pull requests
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
        run: |
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?name=image" --jq '.total_count')" = 0 ]; then
            echo "::notice::The run built no image"
            exit 0
          fi
          if [ "${EVENT}" = push ] && [ "${HEAD_BRANCH}" = main ]; then
            tag=main
            prs=""
            fork=false
          elif [ "${EVENT}" = push ]; then
            tag="$(.github/scripts/image-tag.sh "${HEAD_BRANCH}")" || exit 0
            prs="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${HEAD_BRANCH}" --jq '[.[].number] | join(" ")')"
            fork=false
          else
            # shellcheck disable=SC2016 # $ENV is jq's, not the shell's
            pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${HEAD_OWNER}:${HEAD_BRANCH}" \
              --jq '[.[] | select(.head.sha == $ENV.HEAD_SHA and .head.repo.full_name != $ENV.GITHUB_REPOSITORY) | .number] | first // empty')"
            if [ -z "${pr}" ]; then
              echo "::notice::No open pull request from a fork is at ${HEAD_SHA}"
              exit 0
            fi
            tag="PR${pr}"
            prs="${pr}"
            fork=true
          fi
          {
            echo "tag=${tag}"
            echo "prs=${prs}"
            echo "fork=${fork}"
          } >> "${GITHUB_OUTPUT}"

  approve:
    name: Approve a fork's image
    needs: resolve
    if: needs.resolve.outputs.fork == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Required reviewers on this environment decide whether a fork's image is published.
    environment: pr-images
    steps:
      - name: Approved
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: echo "Publishing ${TAG}"

  publish:
    name: Publish
    needs: [resolve, approve]
    if: >-
      !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.tag != '' &&
      (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # One publish per tag at a time, so an older run can't land after a newer one.
    concurrency:
      group: images-publish-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    permissions:
      actions: write # download the image from the CI run, and delete it once published
      contents: read # check out the default branch for image-comment.js
      packages: write # push the image
      pull-requests: write # comment on the pull requests
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # A newer commit's run publishes instead; it may already have.
      - name: Check the commit is still the head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          FORK: ${{ needs.resolve.outputs.fork }}
          PRS: ${{ needs.resolve.outputs.prs }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "${FORK}" = true ]; then
            head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PRS}" --jq '.head.sha')"
          else
            head="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | cut -f1)"
          fi
          if [ "${head}" = "${HEAD_SHA}" ]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::${HEAD_SHA} is no longer the head (now ${head:-gone}); not publishing it"
          fi

      - name: Push
        id: push
        if: steps.head.outputs.current == 'true'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}"
          skopeo login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<< "${GH_TOKEN}"
          # The manifest list the tag points at now, if any; its digest is the SHA-256 of these exact bytes.
          skopeo inspect --raw "docker://${image}" > "${RUNNER_TEMP}/old.json" 2> /dev/null || rm -f "${RUNNER_TEMP}/old.json"
          skopeo copy --all --preserve-digests "oci-archive:${RUNNER_TEMP}/image/image.tar" "docker://${image}"
          skopeo inspect --raw "docker://${image}" > "${RUNNER_TEMP}/new.json"
          skopeo logout ghcr.io
          echo "digest=$(sha256sum < "${RUNNER_TEMP}/new.json" | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"
          [ -f "${RUNNER_TEMP}/old.json" ] || exit 0
          .github/scripts/image-superseded.sh "${RUNNER_TEMP}/old.json" "${RUNNER_TEMP}/new.json" > "${RUNNER_TEMP}/superseded.txt"
          echo "superseded=${RUNNER_TEMP}/superseded.txt" >> "${GITHUB_OUTPUT}"

      # The registry keeps an image a tag moved off as untagged versions: the manifest list and one manifest per platform. Only those are deleted, and only while untagged.
      - name: Delete the superseded image
        if: steps.push.outputs.superseded != ''
        env:
          SUPERSEDED: ${{ steps.push.outputs.superseded }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/image-delete-untagged.sh "${GITHUB_REPOSITORY_OWNER}" "${GITHUB_REPOSITORY#*/}" < "${SUPERSEDED}"

      # The registry has it now, or a newer one; don't keep a copy as an artifact for days.
      - name: Delete the image artifact
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?name=image" --jq '.artifacts[0].id // empty')"
          if [ -n "${id}" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          fi

      - name: Comment
        if: steps.push.outcome == 'success' && needs.resolve.outputs.prs != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          PRS: ${{ needs.resolve.outputs.prs }}
          DIGEST: ${{ steps.push.outputs.digest }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const comment = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/image-comment.js`);
            await comment({ github, context }, {
              tag: process.env.TAG,
              prs: process.env.PRS.split(' ').map(Number),
              digest: process.env.DIGEST,
              sha: process.env.HEAD_SHA,
              runUrl: process.env.RUN_URL,
            });

  # A fork's image is only published after approval, which its CI run asks for, so only branches here are announced on opening.
  announce:
    name: Announce the image
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the base branch for the scripts
      packages: read # check the branch's image exists
      pull-requests: write # comment on the pull request
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Until the branch's first image is pushed there is nothing to announce; publishing it comments instead.
      - name: Find the image
        id: image
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(.github/scripts/image-tag.sh "${HEAD_REF}")" || exit 0
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${tag}"
          if skopeo inspect --raw --creds "${GITHUB_ACTOR}:${GH_TOKEN}" "docker://${image}" > /dev/null 2>&1; then
            echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Comment
        if: steps.image.outputs.tag != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ steps.image.outputs.tag }}
        with:
          script: |
            const comment = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/image-comment.js`);
            await comment({ github, context }, { tag: process.env.TAG, prs: [context.issue.number] });
