name: Release SLSA

# Builds and attests a release; called by release.yml once the tag checks out. The build lives in this reusable workflow because that's what makes GitHub's artifact attestations SLSA Build Level 3: the provenance is signed by this workflow, not by the one that called it, so verify with --signer-workflow nightah/encore/.github/workflows/release-slsa.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Build web
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          # No dependency cache on release builds (cache-poisoning hardening).
          package-manager-cache: false

      - name: Install
        run: pnpm -C web install --frozen-lockfile

      - name: Build
        run: pnpm -C web build

      - name: Upload SPA bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: internal/server/dist
          if-no-files-found: error
          retention-days: 1

  goreleaser:
    name: GoReleaser
    needs: web
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: write # create the release and upload its assets
      packages: write # push to GHCR
    outputs:
      checksums: ${{ steps.subjects.outputs.checksums }}
      digest: ${{ steps.subjects.outputs.digest }}
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download SPA bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: internal/server/dist

      # GoReleaser refuses to run on a dirty tree, untracked files included. .gitignore already covers the SPA bundle; this keeps the release working if it ever stops doing so.
      - name: Ignore downloaded SPA bundle for git
        run: |
          printf '%s\n' 'internal/server/dist/*' '!internal/server/dist/.gitkeep' >> .git/info/exclude
          git status --porcelain

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # What the provenance covers: every archive and SBOM by its SHA-256, and the multi-arch image by its digest.
      - name: Provenance subjects
        id: subjects
        run: |
          echo "checksums=$(base64 -w0 dist/checksums.txt)" >> "${GITHUB_OUTPUT}"
          digest="$(awk 'NR==1 {print $1}' dist/digests.txt)"
          case "${digest}" in sha256:*) ;; *) digest="sha256:${digest}" ;; esac
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

  # Signs SLSA provenance with Sigstore through GitHub's artifact attestations, in a job of its own so the build steps never hold the signing token. The archives' bundle is attached to the release as encore.intoto.jsonl; the image's is pushed to GHCR next to it. Both are also kept by GitHub, where gh attestation verify finds them.
  attest:
    name: Attest
    needs: goreleaser
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      attestations: write # store the attestations on GitHub
      contents: write # attach encore.intoto.jsonl to the release
      id-token: write # sign the provenance with Sigstore (OIDC)
      packages: write # push the image attestation to GHCR
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Write checksums
        env:
          CHECKSUMS: ${{ needs.goreleaser.outputs.checksums }}
        run: printf '%s' "${CHECKSUMS}" | base64 -d > "${RUNNER_TEMP}/checksums.txt"

      - name: Attest archives
        id: archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/checksums.txt

      - name: Attach provenance to the release
        env:
          BUNDLE: ${{ steps.archives.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c . "${BUNDLE}" > "${RUNNER_TEMP}/encore.intoto.jsonl"
          gh release upload "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/encore.intoto.jsonl" --repo "${GITHUB_REPOSITORY}" --clobber

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Storage records are only for organisation-owned repositories.
      - name: Attest image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/nightah/encore
          subject-digest: ${{ needs.goreleaser.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
