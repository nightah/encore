name: Images

# Builds a test container image for every branch pushed here and every pull request from a fork, for linux/amd64, linux/arm64 and linux/arm/v7, and keeps it as an artifact. The build has no write access and no secrets, so it can run a fork's code; "Publish images" (images-publish.yml) pushes the artifact to ghcr.io/nightah/encore once this run passes, under the branch's name (fix/abc becomes fix-abc) or PR<number> for a fork, after a maintainer approves the fork's run.
on:
  push:
    branches-ignore: [main]
    paths-ignore: ["docs/**"]
  pull_request:
    paths-ignore: ["docs/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build image
    # A branch here builds on push, so its pull request doesn't build it twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The Dockerfile cross-compiles in its build stages and only copies files into the runtime stage, so no emulation is needed. The version shown in the web interface is the tag the image is published under.
      - name: Build
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_name || format('PR{0}', github.event.pull_request.number) }}
          COMMIT: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
            VERSION="$(.github/scripts/image-tag.sh "${VERSION}")" || { echo "::notice::No image for this branch"; exit 0; }
          fi
          mkdir -p "${RUNNER_TEMP}/image"
          docker buildx build \
            --platform linux/amd64,linux/arm64,linux/arm/v7 \
            --build-arg version="${VERSION}" \
            --build-arg commit="${COMMIT}" \
            --build-arg build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --provenance=false \
            --output "type=oci,dest=${RUNNER_TEMP}/image/image.tar" \
            .

      - name: Upload image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image/image.tar
          if-no-files-found: ignore
          retention-days: 3
