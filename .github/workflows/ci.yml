name: CI

# Branches here are tested when they're pushed, so each commit runs once and has its test image (published by images-publish.yml) before a pull request is opened. Pull requests run only for forks, which can't push here. The jobs live in ci-jobs.yml, called as "Pipeline", so a same-repository pull request's skipped run shows up as a single "Pipeline" check rather than as skipped, and so passing, copies of the required "Pipeline / …" checks: GitHub counts a skipped job as passing.
on:
  pull_request:
  push:
    branches: ["**"]

# One run per branch or pull request; a new push cancels the superseded run. Each commit on main gets a group of its own, so its run always finishes: the build badge reports a cancelled run as failing, and every merged commit gets a full result and coverage upload. A shared group wouldn't do, even without cancel-in-progress: a run waiting in it is cancelled when the next merge's run arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read # check out the code
      id-token: write # upload coverage to Codecov without a token (OIDC)
    uses: $/.github/workflows/ci-jobs.yml
