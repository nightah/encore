# actionlint doesn't understand GitHub's $/ self-repository syntax yet (rhysd/actionlint#711), so it rejects release.yml's call to release-slsa.yml. Ignore just that message there; drop this once actionlint supports $/.
paths:
  .github/workflows/release.yml:
    ignore:
      - 'reusable workflow call "\$/\.github/workflows/release-slsa\.yml" at "uses" is not following the format'
