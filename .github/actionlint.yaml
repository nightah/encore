# actionlint doesn't understand GitHub's $/ self-repository syntax yet (rhysd/actionlint#711), so it rejects the calls to this repository's reusable workflows. Ignore just that message; drop this once actionlint supports $/.
paths:
  .github/workflows/*.yml:
    ignore:
      - 'reusable workflow call "\$/\.github/workflows/[^"]+\.yml" at "uses" is not following the format'
