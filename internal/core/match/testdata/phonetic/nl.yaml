# Dutch (nl-NL) phonetic evaluation corpus for TestPhoneticEval. Same schema as asr_corpus.yaml; cases are scored, not asserted, so there is no xfail.
#
# Library: real, well-known Dutch and Flemish films, series, artists and songs plus English-language films and series that Dutch speakers ask for (titles as published, with their original release years), with near neighbours (Flodder, Flodder in Amerika! and Flodder 3, New Kids Turbo and Nitro, Alles is liefde and Alles is familie, Ocean's Eleven and Twelve, Shrek and Shrek 2, Gooische Vrouwen as both film and series, André Hazes and André Hazes Jr., Flikken and Flikken Maastricht) so a wrong play is possible.
#
# Cases: what a speech recogniser plausibly writes when a Dutch or Flemish speaker asks for the title. Each mishearing sits under a "class" comment naming the confusion it models. The classes are documented Dutch spelling-to-sound ambiguities: ij and ei for one diphthong (zij/zei, Spijkerhoek/Speikerhoek), au and ou (Bauer/Bouwer), g and ch for one velar fricative and the soft southern g heard as h (zondag/zondach, goede/hoede), final devoicing and the d/t/dt homophones (gelooft/geloofd, Rat/rad), v/f and z/s devoicing (Flodder/Vlodder, Zwartboek/Swartboek), sch said sx or s and the sh/sj of loans (Gooische/Gooise, Schindler/Sjindler), long vowels written double or single (Baantjer/Bantjer, Kees/Kes) and the archaic ae and oo of old titles (Daens/Daans, Schaep/Schaap), ui, eu and oe (Luizenmoeder/Leuzenmoeder, Anouk/Anoek), the silent n of -en (vrouwen/vrouwe), w and v (Wie/Vie), c as k or s in loans (Clouseau/Kloezo, Ciske/Siske), diminutives added, dropped or said the Flemish way (Kruimeltje/Kruimelke), apostrophe forms ('ns/eens, Ocean's/oceans), compounds split or joined (Luizenmoeder/luizen moeder), English titles respelled by a Dutch recogniser (Breaking Bad/brieking bed), numbers as digits and as words with units before tens (21/eenentwintig, elf/eleven) and real-word substitutions (Bløf/bluf, Undercover/onder cover, Pulp Fiction/pulp fictie). Controls (exact titles), the distinctive opening word of a title (pulp for Pulp Fiction), ambiguous requests (ask), missing sequels (ask) and absent titles (not_found) keep the decision thresholds honest.
#
# Cases describe what a listener hears; don't change a case to suit an encoder's results, or the comparison stops meaning anything (see docs/src/content/docs/contributing/dependencies.md).
