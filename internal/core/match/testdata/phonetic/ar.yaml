# Arabic (ar-SA) phonetic evaluation corpus for TestPhoneticEval. Same schema as asr_corpus.yaml; cases are scored, not asserted, so there is no xfail.
#
# Library: what a Kodi instance in Saudi Arabia plausibly holds, with original release years: Saudi, Egyptian, Lebanese, Syrian, Jordanian and Gulf films and series and Arabic-language artists titled in Arabic script as Kodi's Arabic scrapers give them, and international films, series and artists titled in their English (Latin) form. Near neighbours (sequels, shared words and first names: الفيل الأزرق and الفيل الأزرق 2, ولاد رزق and ولاد رزق 2, باب الحديد and باب الحارة, محمد عبده and محمد منير, راشد الماجد and ماجد المهندس, The Avengers and Avengers: Endgame, The Godfather and Part II, Frozen and Frozen II) make a wrong play possible.
#
# Cases: what Alexa's ar-SA recogniser plausibly writes when a Saudi speaker asks for the title: Arabic script, mostly without diacritics, ASCII or Arabic-Indic digits, Latin only rarely. Each mishearing is tagged with the confusion it models. The classes are documented Arabic spelling-to-sound ambiguities and dialect pronunciations: hamza seats and the bare alef the recogniser often writes instead (أم/ام, إسماعيلية/اسماعيلية, وائل/وايل), ta marbuta written as ha (وجدة/وجده), alif maqsura and final ya swapped (اللمبي/اللمبى), the definite article dropped, added or written as the sun-letter assimilation sounds (الناظر/ناظر/انناظر, ذيب/الذيب), emphatic and plain consonants (طاش/تاش, صعيدي/سعيدي, the Gulf merger of ض and ظ), ق said as g in Gulf speech and written ج, ك or گ (يقابل/يجابل), the interdental mergers of urban Egyptian and Levantine speech (كلثوم/كلتوم, ذيب/ديب, كاظم/كازم), the pharyngeals ع and ح heard as hamza and ه, long vowels shortened and vowel letters dropped (عمرو/عمر, شيرين/شرين), English titles transliterated into Arabic script in several ways (Titanic/تايتانك/تيتانيك), Latin script when the recogniser keeps an English word, word splits and merges with the attached prefixes و ل ف (والكباب/و الكباب, في/ف), real-word substitutions (سكر بنات/سكر نبات, همام/حمام, الهيبة/الهبة), numbers as digits, Arabic-Indic digits and words (2/٢/اتنين/الجزء الثاني), and a distinctive opening word standing for the title. Controls (exact titles) and absent titles (not_found, missing sequels) keep the decision thresholds honest.
#
# Cases describe what a listener hears; don't change a case to suit an encoder's results, or the comparison stops meaning anything (see docs/src/content/docs/contributing/dependencies.md).
