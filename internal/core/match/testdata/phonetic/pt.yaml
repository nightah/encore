# Brazilian Portuguese (pt-BR) phonetic evaluation corpus for TestPhoneticEval. Same schema as asr_corpus.yaml; cases are scored, not asserted, so there is no xfail.
#
# Library: real, well-known Brazilian films, series and artists and English-language films, series and artists popular in Brazil (titles as published, with their original release years; the two Godfather films carry their Brazilian titles as aliases), with near neighbours (sequels, three titles that open with Cidade, three Jorges, Tom Jobim and Tim Maia, Gilberto Gil and Gal Costa, Central do Brasil and Avenida Brasil) so a wrong play is possible.
#
# Cases: what a speech recogniser plausibly writes when a Brazilian Portuguese speaker asks for the title. Each mishearing is tagged with the confusion it models. The classes are documented Brazilian Portuguese spelling-to-sound ambiguities: the many spellings of /s/ (ç, ss, s, c before e/i, sc) and intervocalic s as /z/ (Cássia/Cácia, brasileiro/brazileiro), x as /ʃ/ and its ch spelling (Xuxa/Chucha, Chico/Xico), lh/li and nh/ni (filhos/filios, Bethânia/Betânha), final -l vocalised as /w/ (Brasil/Brasiu, Gil/Giu, auto/alto), nasal endings -m/-n/-ão (Jobim/Jobin), palatalised t and d before i (Tim/Chim, Djavan/Diavan), the r sounds (rr/r, h read as r in English titles, dropped infinitive r), unstressed final e and o raised to i and u (elite/eliti, Mutantes/mutantis), accents and tildes dropped, g/j before e/i, qu/k and gu/g, silent h, the epenthetic i that breaks consonant clusters (Djavan/dijavan, Skank/iskank), English titles respelled as a Brazilian says them (Friends/frends, Coldplay/coudplei), digits against number words including the feminine uma, plus real-word substitutions (Legião/região, Sintonia/sinfonia, Xuxa/chuchu). Controls (exact titles) and absent titles (not_found, missing sequels) keep the decision thresholds honest.
#
# Cases describe what a listener hears; don't change a case to suit an encoder's results, or the comparison stops meaning anything (see docs/src/content/docs/contributing/dependencies.md).
