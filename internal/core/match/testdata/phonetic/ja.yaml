# Japanese (ja-JP) phonetic evaluation corpus for TestPhoneticEval. Same schema as asr_corpus.yaml; cases are scored, not asserted, so there is no xfail.
#
# Library: real, well-known films, series, artists and songs as a Japanese Kodi library holds them (Japanese titles as published, foreign films under their katakana release names, some titles in Latin letters), with their original release years and near neighbours (sequels, shared words and surnames: トイ・ストーリー, 3 and 4, アナと雪の女王 and 2, ゴジラ, シン・ゴジラ and ゴジラ-1.0, 鬼滅の刃 and its film, two ハリー・ポッター, ドラゴンボール and Z, 中島みゆき and 中島美嘉, サザエさん and サザンオールスターズ) so a wrong play is possible.
#
# Cases: what Alexa's ja-JP recogniser plausibly writes when a Japanese speaker asks for the title: kanji, hiragana and katakana without spaces, numbers mostly as ASCII digits, Latin letters rarely and in lower case, punctuation dropped. Each mishearing sits under a "class" comment naming the confusion it models. The classes are documented Japanese spelling-to-sound ambiguities and the errors a recogniser makes when it picks another written form of the same sound: the same word in hiragana, katakana or kanji (となり/隣, サムライ/侍, いきものがかり/生き物係), long vowels written ー, う, お or dropped (セーラー/セイラー, ターミネーター/ターミネータ), small kana and sokuon (うっせぇわ/うっせえわ, スピッツ/スピツ, ポニョ/ポニヨ), dakuten, handakuten and rendaku (かみかくし/かみがくし, プラダ/ブラダ, ポッター/ボッター), ず/づ and じ/ぢ (米津 よねづ/よねず), katakana loanword variants (ヴァ/バ, ティ/チ, ウィ/ウイ, トゥ/ツー, ワ/ヤ), the middle dot and other separators dropped (トイ・ストーリー/トイストーリー), title punctuation (君の名は。, ぼっち・ざ・ろっく！, 「」), particles and okurigana written differently or dropped (は/わ, 戸締まり/戸締り), homophones written with other kanji (神隠し/髪隠し, 進撃/新劇, 名探偵/迷探偵), the short forms people say (アナ雪, 逃げ恥, ミスチル), numbers as digits, kanji numerals and katakana readings (2/ツー/二, 七人/7人, マイナスワン), and Latin titles heard in katakana or the reverse (YOASOBI/ヨアソビ, TSUNAMI/津波). Controls (exact titles) and absent titles (not_found, missing sequels) keep the decision thresholds honest.
#
# Cases describe what a listener hears; don't change a case to suit an encoder's results, or the comparison stops meaning anything (see docs/src/content/docs/contributing/dependencies.md).
