# Hindi (hi-IN) phonetic evaluation corpus for TestPhoneticEval. Same schema as asr_corpus.yaml; cases are scored, not asserted, so there is no xfail.
#
# Library: real, well-known Hindi films, series and artists and Hollywood films as an Indian Kodi library holds them (titles as published by English-language scrapers, so Hindi titles are romanised, with their original release years), plus two series titled in Devanagari. It carries near neighbours (Don 1978 and 2006 and Don 2, Dhoom 1 to 3, Baahubali 1 and 2, Stree and Stree 2, the two Munna Bhai films, Hera Pheri and Phir Hera Pheri, Kabhi Kabhie and Kabhi Khushi Kabhie Gham, Avengers: Endgame and Infinity War, Arijit, Jagjit and Honey Singh, Kishore Kumar and Kumar Sanu) so a wrong play is possible.
#
# Cases: what Alexa's hi-IN recogniser plausibly writes when a Hindi speaker asks for the title. It writes Hindi in Devanagari and often writes English words in Latin script, so the central case is a Devanagari request against a romanised title. Each mishearing sits under a "class" comment naming the confusion it models. The classes are documented Hindi spelling-to-sound and romanisation ambiguities: inconsistent romanisation of one Hindi word (Kabhi/Kabhie, Jayenge/Jaayenge, Kuch/Kuchh, oo/u, ee/i), schwa deletion (धड़कन is dhadkan, not dhadakan; Ramayan/Ramayana), aspirated and unaspirated stops (ख/क, घ/ग, थ/त, भ/ब, फ/प, छ/च), retroflex and dental (ट/त, ड/द, ण/न), nukta and its absence (ज़/ज, फ़/फ, ग़/ग, ड़/ड), anusvara, chandrabindu and a written nasal consonant (जाएंगे/जाएँगे, दंगल/दन्गल), the sibilants श/ष/स, short and long vowels (ि/ी, ु/ू), v and w, English words written in Devanagari in several spellings (अवेंजर्स/एवेंजर्स, नाइट/नाईट), code-mixed requests that switch script mid-title, initialisms said as letter names (पीके, एम बी बी एस), numbers as digits, Devanagari digits and Hindi or English number words (2, २, दो, टू), word splits and merges (अंधा धुन), and real-word substitutions (स्वदेश for Swades, दिल्ली for Delhi, अर्जित for Arijit). Controls (exact titles), ambiguous requests (ask), missing sequels (ask) and absent titles (not_found) keep the decision thresholds honest.
#
# Cases describe what a listener hears; don't change a case to suit an encoder's results, or the comparison stops meaning anything (see docs/src/content/docs/contributing/dependencies.md).
