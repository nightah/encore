# Grown set: testdata/grown is a held-out set of corpora, kept apart from the original set (asr_corpus.yaml and phonetic/). TestASRCorpus and TestPhoneticEval score both sets and report them separately.
#
# Japanese (ja-JP) phonetic evaluation corpus, second set, for TestPhoneticEval. Same schema as asr_corpus.yaml; cases are scored, not asserted, so there is no xfail. It adds two suites with their own libraries to the first Japanese set; no play case repeats a heard string from it, and some absent cases deliberately name titles from its library, which are not in these libraries.
#
# Libraries: real, well-known titles as a Japanese Kodi library holds them, with their original release years: Japanese films, series and anime under their Japanese titles, foreign films under their katakana release names, and Japanese artists, albums and songs, some in Latin letters (back number, LiSA, VARIETY). Each library carries near neighbours that share words, names or numbers (ジュラシック・パーク / ワールド, ロード・オブ・ザ・リング and 二つの塔, ゴッドファーザー and PART II, スパイダーマン and 2, 20世紀少年 and 第2章, 鋼の錬金術師 and FULLMETAL ALCHEMIST, 機動戦士ガンダム and SEED, 踊る大捜査線 the series and THE MOVIE, 東京ラブストーリー / 東京リベンジャーズ, おしん / 【推しの子】, 山下達郎 / 山下智久, 乃木坂46 / 欅坂46 / 日向坂46, two songs called さくら, 桜坂, 恋 / 恋するフォーチュンクッキー, 時代 / 新時代, 赤いスイートピー / 青い珊瑚礁) so a wrong play is possible.
#
# Cases: what Alexa's ja-JP recogniser plausibly writes when a Japanese speaker asks for the title: kanji, hiragana and katakana without spaces, numbers mostly as ASCII digits and sometimes as kanji numerals, Latin letters rarely and in lower case, punctuation dropped. Each mishearing sits under a "class" comment naming the confusion it models. The classes are documented Japanese spelling-to-sound ambiguities and the errors a recogniser makes when it picks another written form of the same sound:
#   script: the same word written in hiragana, katakana or kanji, and kanji readings written out (耳をすませば/耳を澄ませば, 柚子/ゆず, 秋桜/コスモス, 花水木/ハナミズキ).
#   long-vowel: long vowels written ー, う, お or い, or shortened (ジョーカー/ジョカー, スイートピー/スイトピー, 緑黄色/りょくおしょく, グレイ/グレー).
#   small-kana: small kana and sokuon written full size or dropped (ジュラシック/ジユラシック, ゴッド/ゴド, ポルノグラフィティ/ポルノグラフイティ).
#   dakuten: voicing marks and handakuten added or dropped, and rendaku (ゴッド/ゴット, パプリカ/バブリカ, 借りぐらし/借りくらし, 飛行/びこう).
#   zu-ji: ず against づ and じ against ぢ (涼宮 すずみや/すづみや, 地獄 じごく/ぢごく, ハナミズキ/ハナミヅキ).
#   loanword: katakana loanword variants (ヴァ/バ, ヴェ/ベ, ティ/チ, ディ/デイ, ウィ/ウイ, ウォ/ウオ, フォ/ホ, ラブ/ラヴ), e.g. プラスティック/プラスチック, マーヴェリック/マーベリック, フォレスト/ホレスト.
#   middle-dot: the middle dot, slash and spaces between title parts dropped (ジュラシック・パーク/ジュラシックパーク, フォレスト・ガンプ/一期一会).
#   punctuation: ！, 。, 、, 【】, ☆, × and 〜 in titles (カメラを止めるな！, どんなときも。, 世界の中心で、愛をさけぶ, 【推しの子】, まどか☆マギカ, HUNTER×HUNTER).
#   particle: particles and okurigana written differently or dropped, including は/わ (君たちはどう生きるか/君たちわ, 愛をこめて/愛を込めて, 上を向いて/上向いて).
#   homophone: the same sound written with other kanji, often a more frequent real word (錬金術師/錬金術士, 香水/降水, 糸/意図, 残響散歌/残響讃歌, 家政婦のミタ/家政婦の見た).
#   partial: the distinctive opening words of a title and the short forms people say (ナウシカ, 時かけ, カメ止め, ワンオク, ドリカム, モー娘).
#   number: digits, kanji numerals and katakana readings, and numbers a recogniser writes as digits inside words (秒速5/秒速五, 46/フォーティーシックス, PART II/パート2/パートツー, 三十郎/30郎, 少女A/少女エー).
#   latin: Latin titles heard in katakana and katakana titles heard in Latin letters (HERO/ヒーロー, VIVANT/ビバン, Aimer/エメ, SUKIYAKI/スキヤキ, NARUTO/naruto).
# Controls (exact titles as an ASR writes them), ambiguous requests (ask among the near neighbours), missing sequels (ask) and absent titles (not_found, including near misses that share words or names with library titles) keep the decision thresholds honest.
#
# Cases describe what a listener hears; don't change a case to suit an encoder's results, or the comparison stops meaning anything (see docs/src/content/docs/contributing/dependencies.md).
