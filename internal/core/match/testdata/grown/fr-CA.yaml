# Grown set: testdata/grown is a held-out set of corpora, kept apart from the original set (asr_corpus.yaml and phonetic/). TestASRCorpus and TestPhoneticEval score both sets and report them separately.
#
# Québec French (fr-CA) evaluation corpus for TestPhoneticEval. This locale is matched with the French (fr) rules, so every suite has lang: fr. Same schema as asr_corpus.yaml; cases are scored, not asserted, so there is no xfail. There is no development set for this locale: every case here is held out.
#
# Libraries: two suites of real, well-known Québec titles with their original release years. Suite one is film and television, suite two is music (artists, albums and songs). Each library carries near neighbours that share words, names or numbers so a wrong play is possible: numbered sequels (Les Boys to Les Boys IV and Il était une fois les Boys, Bon Cop, Bad Cop and its sequel, De père en flic 1 and 2, Cruising Bar 1 and 2, three Elvis Gratton, La Guerre des tuques and La Guerre des tuques 3D, the series and two films called Dans une galaxie près de chez vous), Ricardo Trogi's year-titled films 1981, 1987 and 1991, the two empire américain films, the French and English series both called 19-2, Omertà as series and film, Éric and Pierre Lapointe, Isabelle Boulay and Les Sœurs Boulay, Harmonium the band and the album, Les Cowboys Fringants and Bye Bye Mon Cowboy.
#
# Cases: what a speech recogniser plausibly writes when a Québec speaker asks for the title. Mishearings are grouped under a comment naming the confusion class they model. The classes are the documented features of Québec French pronunciation (Ostiguy and Tousignant, Les prononciations du français québécois, 2008; Dumas, Les prononciations en français québécois, 1987) and the French spelling-to-sound ambiguities they compound:
# - affrication: t and d before i, u and their glides are affricated to [ts] and [dz] (tu heard tsu, dire heard dzire, petite heard petsite, District heard dzistrict).
# - diphthong: long vowels diphthongised in stressed syllables, mostly before r (père/paère, mère/maère, encore/encaore, cœur/caeur, jaune/jaoune).
# - oi: oi pronounced [we] or [wɛ] in popular speech and written oé or ouè (moi/moé, fois/foé, trois/troé, quoi/kwè), and oin heard ouin (Lapointe/Lapouinte).
# - nasal: nasal vowel shifts and the spellings they blur: in/un merged, an/en fronted towards in, on/an confused, ien heard in (un/in, menteur/manteur, oncle/ancle).
# - elision: elided pronouns, articles and ne, and the Québec contractions (je suis > chu, je sais > chais, il > y, de la > d'la, mon oncle > mononcle, à la > à).
# - english: English titles and the anglicisms of Québec speech respelled by a Québec recogniser (Bon Cop, Bad Cop > bonne cope bad cope, Gaz Bar Blues > gaz bar blouse, break > brèque, toune and tune), and English names said the French way.
# - silent: silent final consonants and plural marks added or dropped (Les Boys/les boy, Les Parent/les parents), including the silent h.
# - number: digits against number words, the Québec year reading dix-neuf cent quatre-vingt-sept beside mille neuf cent, sequel numbers in roman numerals read as words, letters and abbreviations (Québec, like France, says soixante-dix and quatre-vingt-dix, never septante or nonante).
# - real-word: substitution by a more frequent homophone or near-homophone word (mère/mer/maire, Fugueuse/fougueuse, Mes Aïeux/mes yeux, Karkwa/carquois, Bélanger/boulanger).
# - split: word splits and merges, dropped hyphens and apostrophes, and letters run together or spelt out (C.R.A.Z.Y.).
# - diacritic: accents dropped by the recogniser or text normalisation.
#
# Controls (the title as written, distinctive opening words, plus genuine ambiguity that must ask) and absent titles (not_found for titles not in the library, including near misses that share words or first names with library titles; ask for missing numbered sequels, as in the French corpora) keep the decision thresholds honest.
#
# Cases describe what a listener hears; don't change a case to suit an encoder's results, or the comparison stops meaning anything (see docs/src/content/docs/contributing/dependencies.md).
