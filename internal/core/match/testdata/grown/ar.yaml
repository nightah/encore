# Grown set: testdata/grown is a held-out set of corpora, kept apart from the original set (asr_corpus.yaml and phonetic/). TestASRCorpus and TestPhoneticEval score both sets and report them separately.
#
# Arabic (ar-SA) phonetic evaluation corpus, second set, for TestPhoneticEval. Same schema as asr_corpus.yaml; cases are scored, not asserted, so there is no xfail. It adds three suites with their own libraries to the first Arabic set; no play case repeats a heard string from it, and some absent cases deliberately name titles from its library, which are not in these libraries.
#
# Libraries: what a Kodi instance in Saudi Arabia plausibly holds, with original release years. Suite one is Arabic films and series (Egyptian, Saudi, Kuwaiti, Syrian and Lebanese) titled in Arabic script as Kodi's Arabic scrapers give them; suite two is Arabic music (artists, albums and songs in Arabic script, plus a few North African and French-Arabic artists and songs tagged in Latin script); suite three is international films, series, artists and songs titled in their English (Latin) form, which a Saudi speaker asks for in Arabic script. Each library carries near neighbours that share words, names or numbers so a wrong play is possible: الجزيرة and الجزيرة 2, عسل أسود and النوم في العسل, مندوب الليل and ساهر الليل, إشاعة حب and صغيرة على الحب, بين القصرين and قصر الشوق, عروس بيروت and أبو العروسة; نوال الزغبي and نوال الكويتية, three Mohammeds, أصيل أبو بكر and أبو بكر سالم, Khaled and خالد عبد الرحمن, آه ونص and أخاصمك آه, ألف ليلة وليلة and ليلي نهاري, the album and the song both called تملي معاك; The Dark Knight and The Dark Knight Rises and Dark, two Harry Potters, two Lord of the Rings, Fast & Furious, Fast Five and Furious 7, two Aladdins, Avatar, Shrek, Home Alone, Mission: Impossible, John Wick and Dune with their sequels.
#
# Cases: what Alexa's ar-SA recogniser plausibly writes when a Saudi speaker asks for the title: Arabic script, mostly without diacritics, ASCII or Arabic-Indic digits, Latin only rarely. Each mishearing sits under a "class" comment naming the confusion it models. The classes are documented Arabic spelling-to-sound ambiguities, dialect pronunciations a Saudi Kodi household brings to Egyptian, Levantine and Gulf titles, and the errors an ASR language model makes when a name is out of vocabulary or a more frequent word sounds alike:
#   hamza: hamza seats (أ إ آ ء ؤ ئ) dropped to a bare alef, waw or ya, or added where the title has none (أسود/اسود, البريء/البريئ/شيء/شي, فؤاد/فواد, الطوائف/الطوايف, آه/اه, هيفاء/هيفا).
#   ta-marbuta: final ة written ه (الجزيرة/الجزيره, وردة/ورده, حلوة/حلوه).
#   alif-maqsura: final ى and ي swapped either way, as Egyptian spelling does (على/علي, ذكرى/ذكري, خلي/خلى, عمري/عمرى).
#   article: the definite article ال dropped, or written as its assimilation sounds before a sun letter, heard as a doubled consonant (الزير/زير/ازير, الصافي/اصصافي, الرباعي/اررباعي), or added where the title has none (لمجرد/المجرد); English "the" said ذا or dropped as the article is.
#   emphatic: emphatic and plain consonants confused (ط/ت, ص/س, ض/د), and the Gulf merger of ض and ظ (طيور/تيور, صقر/سقر, فضل/فظل, الظلام/الضلام).
#   qaf: ق said as g in Gulf speech and written ج, ك or گ (ناقة/ناجة/ناگة, قماشة/جماشة/كماشة), ق said as a glottal stop in Egyptian speech (قصر/أصر, قلبي/ألبي, قمرين/امرين) and restored where it was never written (أوي/قوي), and g in English names written ق, ج or غ (Gladiator/قلادييتر/جلادياتور/غلادياتور).
#   interdental: ث, ذ and ظ merged with ت/س, د/ز and ز in urban Egyptian and Levantine speech, and English th written ث, ذ, ت, س or ز (الثانية/التانية, ثرثرة/ترترة/سرسرة, ذات/زات/دات, ذكرى/زكرى, the/ذا/زا).
#   pharyngeal: ع heard as hamza or alef, ح as ه, خ as ح (الحرام/الهرام, خلي/حلي, علامة/الامة).
#   vowel: long vowels shortened, vowel letters dropped or added, English vowels written with or without long-vowel letters (الأتوبيس/الاتبيس/الأوتوبيس, كراكون/كركون, شيران/شيرين, Avatar/افاتار/افتار).
#   foreign: English and Turkish consonants Arabic lacks, p written ب, v written ف or ڤ, ch written تش or ش, and other transliteration choices (Peaky/بيكي, Vikings/فايكنقز/ڤايكنقز, Ertuğrul/ارطغرل/ارطوغرل, Khaled/خالد, Aïcha/عايشة).
#   split-merge: words split or merged, compound names (عبدالله/عبد الله, ابوبكر/ابو بكر), the attached prefixes و and ف and the Levantine عال for على (والدموع/و الدموع, في العمارة/فالعمارة).
#   real-word: a more frequent real word replaces the title word (الحريف/الخريف, السكرية/السكري, سيلفي/سلفي, هجان/هجين, Shrek/شريك, Dune/ديون, Rihanna/ريحانة, بشرة/بشرى).
#   latin: the recogniser keeps an English title in Latin script.
#   number: digits, Arabic-Indic digits and number words, Egyptian and standard (2/٢/اتنين/الجزء الثاني/التاني, 3/٣/تلات/ثلاث, 7/سفن/سبعة).
#   short: the title as people say it, a distinctive opening word or name standing for the whole.
# Controls (exact titles as an ASR writes them, punctuation dropped), ambiguous requests (ask among the near neighbours), missing sequels (ask) and absent titles (not_found, including near misses that share words with library titles) keep the decision thresholds honest.
#
# Cases describe what a listener hears; don't change a case to suit an encoder's results, or the comparison stops meaning anything (see docs/src/content/docs/contributing/dependencies.md).
