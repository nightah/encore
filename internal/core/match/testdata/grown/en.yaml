# Grown set: testdata/grown holds corpora added on top of the original ones (asr_corpus.yaml and phonetic/), which stay untouched. TestASRCorpus and TestPhoneticEval score both sets and report them separately.
#
# English (en-AU, en-GB, en-US) phonetic evaluation corpus for TestPhoneticEval, a second library alongside the English suite in asr_corpus.yaml. Same schema; cases are scored, not asserted, so there is no xfail.
#
# Library: real, well-known English-language films, series, artists, albums and songs (titles as published, with their original release years), with near neighbours so a wrong play is possible: remakes and same-title items of another kind (A Star Is Born, Aladdin, Fargo, Purple Rain, Bohemian Rhapsody), sequels and numbered siblings (21 and 22 Jump Street, Adele's 21, 25 and 30), shared words (Brave/Braveheart, Sunshine/Little Miss Sunshine, Mad Max/Mad Men, Top Gun/Top Gear, Knight and Day/The Dark Knight) and shared first names (Billie Holiday, Billie Eilish, Billy Joel, Billy Idol; Stevie Wonder and Stevie Nicks; Olivia Rodrigo and Olivia Newton-John; Leonard Cohen and Lynyrd Skynyrd).
#
# Cases: what a speech recogniser plausibly writes when an English speaker asks for the title. Each mishearing is tagged, by the section it sits in, with the confusion it models. The classes come from English's deep orthography, where one sound has many spellings, and from the documented error patterns of speech recognisers, whose language model prefers a frequent in-vocabulary word or spelling over an out-of-vocabulary name:
#   - homophones and real-word substitutions (knight/night, Bourne/born, rain/reign, Kane/cane, Lorde/lord, Sia/see a, U2/you too, Def Leppard/deaf leopard, Lynyrd Skynyrd/Leonard Skinner)
#   - word splits and merges in compounds and brand names (Goodfellas/good fellas, Radiohead/radio head, Good Will/goodwill, Nevermind/never mind)
#   - vowel spellings and the unstressed schwa (ee/ea/ie, -ance/-ence, -er/-or/-ar, a/o in apocalypse, ei/ie in Springsteen)
#   - consonant spellings and silent letters (ph/f, c/k/ck, s/z, ps-, h after r, the c in arctic, th/t, j/y)
#   - doubled and single consonants (Forrest/forest, Paddington/Padington, Mamma/mama, Aladdin/Aladin)
#   - connected-speech reductions and accent effects: American t-flapping (Notting/nothing), Australian and British non-rhoticity (Mirror/Mira), consonant-cluster reduction (sixth/six), g-dropping (Singin'/singing), of/o', used to/use to, clipped titles (Parks and Rec, Les Mis)
#   - foreign-name spellings and regional titles (Ratatouille, Lebowski, Moulin Rouge, Tchaikovsky, Björk, Sinéad, Zootropolis, Dunkerque)
#   - number forms: digits, words, homophones of digits (too/two/to, four/for, sum/some), years read as pairs, hundreds read with "and", ordinals and spellings like Boyz II Men
#   - letters, acronyms, symbols and abbreviations (R.E.M., INXS/in excess, NCIS, &/and, +, !, $, Mr./mister, Inc.)
#   - inflection, articles and dropped or added words (plural and possessive s, a leading "the", a surname alone, a subtitle alone)
# Controls (exact titles, including deliberate same-title ambiguity that should ask) and absent titles (not_found for titles sharing words with the library, ask for missing sequels as asr_corpus.yaml does) keep the decision thresholds honest.
#
# This corpus was written and frozen blind, without running or reading any encoder or matcher evaluation; changing it after seeing an encoder's results invalidates the comparison.
