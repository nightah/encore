# Grown set: testdata/grown is a held-out set of corpora, kept apart from the original set (asr_corpus.yaml and phonetic/). TestASRCorpus and TestPhoneticEval score both sets and report them separately.
#
# German (de-DE) evaluation corpus, second batch: two more German libraries for TestPhoneticEval in the same schema as asr_corpus.yaml and phonetic/de.yaml. Cases are scored, not asserted, so there is no xfail.
#
# Libraries: real, well-known German-language films, series, artists, albums and songs, titled as published with their original release years. Each library carries near neighbours so a wrong play is possible: numbered sequels and remakes (Die wilden Kerle 1 to 3, Deutschland 83 and 86, Ku'damm 56 and 59, two Emil und die Detektive, two Das fliegende Klassenzimmer, Heidi and Wickie as both film and series), shared words (four SOKO spin-offs, Das Traumschiff and (T)Raumschiff Surprise, Über den Wolken, Wolke 7 and Lila Wolken, Lieder and Leiser) and shared first names (Peter, Nina, Max, Wolfgang, Reinhard and Rainhard, Andrea and Andreas, Lena and Lea).
#
# Cases: what a speech recogniser plausibly writes when a German speaker asks for the title. Every mishearing sits under a section tagged with the confusion class it models. The classes are documented German spelling-to-sound ambiguities and typical recogniser errors:
# [fd] final devoicing (Auslautverhärtung): b/p, d/t, g/k written either way at the end of a syllable, and -ig said as -ich.
# [fv] f/v/ph and w/v: v is /f/ in native words and /v/ in loans, w is /v/, pf reduced to f in northern speech.
# [diph] diphthong spellings: ei/ai/ay/ey for /aɪ/, eu/äu/oi/oy for /ɔʏ/.
# [len] vowel length and consonant doubling: ie/i, silent lengthening h, aa/ee/oo, ss/s, ll/l, tt/t, mm/m.
# [uml] umlaut transcription and unrounding: ä/ae/e, ö/oe/e, ü/ue/u/i.
# [sib] sibilants and affricates: ß/ss/s, z/ts/tz, s/z, st/sp said as scht/schp, sch/sh, tsch/ch.
# [kx] k sounds: c/k/ck, x/ks/cks/chs, ch read as /k/, silent k in kn for non-native speakers.
# [ch] ch said as sch (Rhineland and Hessian coronalisation of the ich-laut) or as k/tsch in loans.
# [rvoc] r vocalisation and schwa loss: -er heard as -a, -en reduced to -n, colloquial is for ist, dropped e.
# [split] compounds and multi-word names split or merged, hyphens dropped.
# [rws] real-word substitution: the recogniser picks a common dictionary word that sounds the same or nearly so.
# [foreign] foreign-name and loanword spellings: English, French, Spanish and Polish names written as a German speaker says them, or German readings of English spellings.
# [num] number and symbol forms: digits, number words, compound number words, Roman numerals, years, + said as und.
# [init] initialisms and letter names spelled out.
# [short] the title as people say it: a dropped subtitle or leading part.
#
# Controls (exact titles, lowercased as a recogniser writes them) and absent titles (ask for missing numbered sequels, as asr_corpus.yaml does; not_found for spin-offs, near-miss titles not in the library and well-known titles that are simply absent) keep the decision thresholds honest.
#
# Cases describe what a listener hears; don't change a case to suit an encoder's results, or the comparison stops meaning anything (see docs/src/content/docs/contributing/dependencies.md).
