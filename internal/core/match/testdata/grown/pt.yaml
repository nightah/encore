# Grown set: testdata/grown is a held-out set of corpora, kept apart from the original set (asr_corpus.yaml and phonetic/). TestASRCorpus and TestPhoneticEval score both sets and report them separately.
#
# Brazilian Portuguese (pt-BR) phonetic evaluation corpus, second set, for TestPhoneticEval. Same schema as asr_corpus.yaml; cases are scored, not asserted, so there is no xfail. It adds three suites with their own libraries to the first Brazilian Portuguese set; no play case repeats a heard string from it, and some absent cases deliberately name titles from its library, which are not in these libraries.
#
# Libraries: suite one is Brazilian films, series and telenovelas, suite two is Brazilian music (artists, albums and songs), suite three is English-language films, series and music as Brazilians ask for them (English titles as published, with the Brazilian release title as an alias where Brazilians use it, such as Esqueceram de Mim, De Volta para o Futuro and Homem-Aranha). Every entry is real, with its original release year. Each library carries near neighbours that share words, names or numbers (De Pernas pro Ar 1 and 2, Terra em Transe and Terra Nostra, Chico Xavier and Xica da Silva, Bye Bye Brasil and Carlota Joaquina, Princesa do Brazil, Duas Caras, Os Dez Mandamentos and Dona Flor e Seus Dois Maridos, João and Bebel Gilberto, Paulinho da Viola and Martinho da Vila, País Tropical, Pais e Filhos and Que País É Este, Construção as album and song, Mamonas Assassinas, Tribalistas and Secos & Molhados as artist and album, Harry Potter 1 and 2, Home Alone 1 and 2, Back to the Future 1 and 2, Rocky 1 and 2, Top Gun and Top Gun: Maverick, Homem-Aranha and Homem de Ferro, House and House of Cards) so a wrong play is possible.
#
# Cases: what a speech recogniser plausibly writes when a Brazilian Portuguese speaker asks for the title. Each mishearing sits under a "class" comment naming the confusion it models. The classes follow the spelling-to-sound ambiguities of Brazilian Portuguese described in Cristófaro Silva, Fonética e fonologia do português (1999) and Mattoso Câmara, Estrutura da língua portuguesa (1970), and the errors ASR language models make when a name is out of vocabulary or a more frequent word sounds alike:
#   sibilant: /s/ written ç, ss, s, sc or c before e/i, and intervocalic s as /z/ (Sucesso/suceso, Marisa/Mariza, Nascimento/nacimento, Isaura/Izaura).
#   x-ch: x has four values, /ʃ/ (Xingu), /ks/ (táxi), /s/ (próximo) and /z/ (exagerado), and /ʃ/ is also spelled ch (Xica/Chica, Chico Xavier/Xico Chavier, Exu/Echu, Show/Xou).
#   lh-nh: the palatal lateral and nasal written as li and ni or lost (filhos/filios, Ilha/Ilia, Thiaguinho/Thiaguinio).
#   final-l: syllable-final l vocalised to /w/, so l and u are written either way (Brasil/Brasiu, Abril/abriu, Sol/sou, saudade/saldade, Picapau/Picapal).
#   nasal: nasal endings -m, -n, -ão, -am and -ã written for one another (Luan/Luã, usam/usão, não/num, saíram/sairão, homem/homi).
#   palatal: t and d before i palatalised to /tʃ/ and /dʒ/, and Di read as de (Tieta/Chieta, Thiaguinho/Chiaguinho, Zezé Di Camargo/de Camargo, Pitty/Pitchi).
#   r: rr and r, the final r dropped in speech (Lar/lá, Xavier/xaviê, envolver/envolvê), English h heard as the Brazilian r (Harry/Rarry, Hey/rei) and the popular rhotacism of l in clusters (flores/frores, clube/crube).
#   vowel: unstressed e and o raised to i and u (leite/leiti, perdido/perdidu, e/i), pretonic raising (destino/distino, estômago/istômago) and ei/ou reduced to e/o (companheiro/companhero).
#   accent: accents and tildes dropped (Malhação/malhacao, País/pais, Cálice/calice).
#   g-j: g before e and i against j (Getúlio/Jetúlio, Gilberto/Jilberto, exagerado/exajerado).
#   qu-gu: qu and gu with and without a sounded u, written k or cu (que/ke, Joaquina/Joakina, Aquarius/Acuarius).
#   h: silent h dropped or added (Hilda/Ilda, homem/omem, Emicida/homicida, Havaí/Avaí).
#   epenthesis: the i that breaks a consonant cluster or follows a final consonant (signo/siguino, disritmia/disritimia, black/bléqui, Alok/Alóqui, Psicose/Pissicose).
#   doubled: the doubled letters of artistic names that no one hears (Gusttavo/Gustavo, Pabllo Vittar/Pablo Vitar, Ludmilla/Ludmila, Claudia Leitte/Leite).
#   foreign: English names and titles respelled in Brazilian Portuguese phonology (Bye Bye/bai bai, Johnny/Djôni, Breaking Bad/breiquin bédi, Michael Jackson/Maicou Djéquisson) and letter names (MC's/emecês, U2/iú tú).
#   number: digits against number words, the feminine duas, ordinals and part numbers (Duas Caras/2 caras, Os Dez Mandamentos/os 10 mandamentos, Segunda Chamada/2a chamada, Trem das Onze/trem das 11, Rocky II/rocky dois).
#   real-word: a more frequent real word replaces the title word (Tieta/dieta, Xingu/xingou, Cangaço/cansaço, Cálice/cale-se, Asa Branca/casa branca, Metallica/metálica).
# Controls (exact titles as an ASR writes them, lower case, punctuation dropped, and the distinctive opening words of a title), ambiguous requests (ask among the near neighbours), missing sequels (ask) and absent titles (not_found, including near misses that share words with library titles) keep the decision thresholds honest.
#
# Cases describe what a listener hears; don't change a case to suit an encoder's results, or the comparison stops meaning anything (see docs/src/content/docs/contributing/dependencies.md).
