# Grown set: testdata/grown holds corpora added on top of the original ones (asr_corpus.yaml and phonetic/), which stay untouched. TestASRCorpus and TestPhoneticEval score both sets and report them separately.
#
# Italian (it-IT) phonetic evaluation corpus, second set, for TestPhoneticEval. Same schema as asr_corpus.yaml; cases are scored, not asserted, so there is no xfail. It adds two suites with their own libraries to the first Italian set; no play case repeats a heard string from it, and some absent cases deliberately name titles from its library, which are not in these libraries.
#
# Libraries: real, well-known Italian films and series (with original release years) and Italian artists, albums and songs (albums and songs with their original years), with near neighbours that share words, first names or surnames (C'era una volta il West / in America, Benvenuti al Sud / al Nord, Rocco e i suoi fratelli / Rocco Schiavone, 1992 / 1993, Zero / ZeroZeroZero, Anna / Annalisa, Mango / Angelina Mango, Edoardo / Eugenio Bennato, four Francescos, Felicità / Felicità puttana, Il Volo / Volare) so a wrong play is possible.
#
# Cases: what a speech recogniser plausibly writes when an Italian speaker asks for the title. Each mishearing sits under a "class" comment naming the confusion it models. The classes are documented Italian spelling-to-sound ambiguities and the errors ASR language models make when a name is out of vocabulary or a more frequent word sounds alike:
#   geminate: double consonants shortened by northern speakers and lengthened by central-southern speakers (raddoppiamento), e.g. Cabiria notti/noti, Pezzali/Pezali, Biagio/Biaggio.
#   palatal: c and g before e/i versus ch/gh, and the diacritic i of cie/gie/cia/gio that carries no sound (cielo/celo, Cenere/Cienere, Geolier/Giolier, Lamborghini/Lamborgini).
#   gn-gli: the palatal nasal and lateral written as ni/nni and li/lli (Cutugno/Cutunio, figlio/filio, signore/signiore).
#   z-s: z (/ts/, /dz/) against s, and the regional voicing of intervocalic s (divorzio/divorsio, paradiso/paradizo, musica/muzica).
#   h: the silent h of avere and of Latin and foreign words (ho/o, hanno/anno, Habemus/Abemus, Ermal/Hermal).
#   accent: written accents on final stressed vowels dropped or misplaced (più/piu, metà/meta, Carrà/Carra, Poët/Poet).
#   elision: apostrophes, elided articles and dropped articles (l'avventura/lavventura/la avventura, all'italiana/alla italiana, L'italiano/italiano).
#   split-merge: one word split into several or several merged (Borotalco/boro talco, ZeroZeroZero/zero zero zero, Al Bano/Albano).
#   real-word: a more frequent real word replaces the title word (Verdone/verde, cera/c'era, Blanco/bianco, Marracash/Marrakesh, zitti/ziti, cannone/canone).
#   foreign: English, French and Latin names respelled in Italian phonology, and letter names (Jeeg/gig, Youth/iut, Afterhours/after ours, Rkomi/erre komi, Johnny/Gianni).
#   number: digits against words and the number forms Italian titles use (8½/otto e mezzo, 1992/millenovecentonovantadue, 883/otto otto tre, sei/6).
# Controls (exact titles as an ASR writes them, lower case, punctuation dropped), ambiguous requests (ask among the near neighbours), missing sequels (ask) and absent titles (not_found, including near misses that share words with library titles) keep the decision thresholds honest.
#
# This corpus was written and frozen blind: without running or reading any encoder or matcher evaluation and without reading any encoder source. Changing it after seeing an encoder's results invalidates the comparison.
