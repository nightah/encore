# Grown set: testdata/grown is a held-out set of corpora, kept apart from the original set (asr_corpus.yaml and phonetic/). TestASRCorpus and TestPhoneticEval score both sets and report them separately.
#
# Latin American and US Hispanic Spanish (es-MX, es-US) evaluation corpus for TestPhoneticEval. These locales are matched with the Spanish (es) rules, so every suite has lang: es. Same schema as asr_corpus.yaml; cases are scored, not asserted, so there is no xfail. There is no development set for these locales: every case here is held out.
#
# Libraries: three suites of real, well-known titles with their original release years. Suite one is Mexican film and television, suite two is Mexican music (artists, albums and songs), suite three is US Hispanic and Caribbean film, television and music, where English and Spanish titles sit side by side. Each library deliberately carries near neighbours that share words, first names, surnames or numbers so that a wrong play is possible (Nosotros los Nobles and Nosotros los pobres, Los tres García and Vuelven los García, two Pedro Páramo and two Rebelde, Narcos and Narcos: México, Vicente, Alejandro and Pedro Fernández, Juan Gabriel and Ana Gabriel, Jenni and Lupillo Rivera, Banda MS and Banda el Recodo, Romance, Segundo Romance, Romances and Mis romances, ¿Dónde jugarán los niños? and ¿Dónde jugarán las niñas?, Los dúo and Los dúo 2, Selena the artist, the film and the series, La Bamba the film and the song, Amor prohibido and Dreaming of You as album and song, X 100pre and Un x100to, Machete and Machete Kills, Jennifer Lopez and George Lopez).
#
# Cases: what a speech recogniser plausibly writes when a Mexican or US Hispanic speaker asks for the title. Each mishearing sits under a comment naming the confusion class it models. The classes follow the regional features described in Lipski, Latin American Spanish (1994), Moreno de Alba, El español en América (2001), and Hualde, The Sounds of Spanish (2005), and the spelling-to-sound ambiguities in the RAE and ASALE Ortografía de la lengua española (2010):
# - seseo: c before e/i, z and s are one phoneme /s/ in all of the Americas, so the recogniser writes any of them (Fernández/Fernándes, cielos/sielos, Ozuna/Osuna), sometimes landing on a real word (casa/caza).
# - yeismo: ll and y are one sound (lloran/yoran, Callaíta/Cayaíta, ya/lla).
# - final-s: syllable-final s aspirated or lost in Caribbean and US Hispanic speech, which also deletes plural markers (los tigres > lo tigre, Estefan > Etefan).
# - liquids: Caribbean, especially Puerto Rican, r and l neutralised at the end of a syllable (porto > polto, verano > velano).
# - x: x in Mexican names is /x/ (México), /s/ (Xochimilco, Ximena), /ʃ/ (Xico, Ixcanul) or /ks/; the recogniser writes j, s, sh, ch or x, and the Spanish-style spelling Méjico.
# - nahuatl: tl and tz clusters and Nahuatl-origin words (Tizoc, Tlatelolco, Chapulín) simplified, split or respelled (Tlatelolco > Tatelolco or Tlaltelolco, Tizoc > Tisoc).
# - jota: the jota is a soft [h] in Mexican, Caribbean and US speech, so a recogniser trained on English writes h; the silent h is added or dropped.
# - d-loss: intervocalic and final d lost (-ado > -ao, -ida > -ía, de > e, nadie > naide), strongest in Caribbean speech, plus the hypercorrection that restores a d the title elides (Callaíta > calladita).
# - betacism: b and v are one phoneme /b/; Café Tacvba's v is read u.
# - velar: /k/ written c, qu or k, /g/ before e/i as gu, and güe/hue/we interchanged (Güeros > weros).
# - english: English titles and names, and Spanglish, respelled by a Mexican or US recogniser (Birdman > berdman, Jane the Virgin > yein de virgin, Gimme tha Power > gimi da pauer).
# - number: digits against Mexican number words (veintiún, cuatrocientos seis), years read out (del sesenta y ocho), letter names (pe erre ce, te cu eme), and titles whose letters stand for words (X 100pre is por siempre, un x100to is un por ciento, YHLQMDLG is yo hago lo que me da la gana).
# - real-word: substitution by a common word near the title word (Nobles > nopales, Infierno > invierno, Querida > quería, Xavi > Javi).
# - diacritic: accents, ñ and punctuation lost.
# Controls are exact titles and distinctive opening words of a title. Ambiguous cases ask, naming the candidates that must be offered. Absent cases are titles not in the library: unrelated titles, near-miss titles that share words with a library title (not_found), and missing sequels of a franchise or numbered title the library holds (ask).
#
# Cases describe what a listener hears; don't change a case to suit an encoder's results, or the comparison stops meaning anything (see docs/src/content/docs/contributing/dependencies.md).
