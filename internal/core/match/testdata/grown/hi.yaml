# Grown set: testdata/grown is a held-out set of corpora, kept apart from the original set (asr_corpus.yaml and phonetic/). TestASRCorpus and TestPhoneticEval score both sets and report them separately.
#
# Hindi (hi-IN) phonetic evaluation corpus, second set, for TestPhoneticEval. Same schema as asr_corpus.yaml; cases are scored, not asserted, so there is no xfail. It adds three suites with their own libraries to the first Hindi set; no play case repeats a heard string from it, and some absent cases deliberately name titles from its library, which are not in these libraries.
#
# Libraries: real, well-known titles as an Indian Kodi library holds them, with their original release years. English-language scrapers romanise Hindi titles (Deewaar, Qayamat Se Qayamat Tak, Kaun Banega Crorepati) and a minority of titles are in Devanagari (शक्तिमान, चंद्रकांता, हम लोग, बुनियाद, पंडित जसराज). Suite one is Hindi and pan-Indian films and series, suite two is Hindi and Punjabi music (artists, albums and songs), suite three is Hollywood and international films, series and cartoons that Indian viewers ask for in Hindi. Each library carries near neighbours that share words, names or numbers (Gadar and Gadar 2, Krrish and Krrish 3, K.G.F chapters 1 and 2, Pushpa 1 and 2, Chashme Buddoor 1981 and Chashme Baddoor 2013, Delhi-6 and Delhi Belly, Jodhaa Akbar and Amar Akbar Anthony, Jawan and Yeh Jawaani Hai Deewani, Singham and Singham Returns, Welcome and Welcome Back, Armaan Malik, Amaal Mallik and Anu Malik, Sunidhi and Mohit Chauhan, Shankar Mahadevan, Shankar–Jaikishan and Ravi Shankar, R. D. and S. D. Burman, Sukhwinder and Mika Singh, Tum Hi Ho, Tum Se Hi and Agar Tum Saath Ho, Aashiqui and Aashiqui 2, Kandisa the album and the song, Iron Man 1 to 3, Spider-Man, Spider-Man 2 and No Way Home, two Harry Potter films, The Godfather and Part II) so a wrong play is possible.
#
# Cases: what Alexa's hi-IN recogniser plausibly writes when a Hindi speaker asks for the title. It writes Hindi in Devanagari and often writes English words and names in Latin script, so most cases are Devanagari requests against romanised titles. Each mishearing sits under a "class" comment naming the confusion it models. The classes are documented Hindi spelling-to-sound and romanisation ambiguities and the errors a recogniser's language model makes when a name is out of vocabulary or a more frequent word sounds alike:
#   script: the title said exactly, written in Devanagari against a romanised title (दीवार for Deewaar, ज़ंजीर for Zanjeer), or in Latin against a Devanagari title (shaktimaan for शक्तिमान).
#   romanisation: one Hindi word romanised several ways in Latin script: aa/a, ee/i, oo/u, w/v, z/j, q/k, kh/k, au/ou, double or single consonants (Deewaar/deewar, Zanjeer/zanjir, Koun/kaun, Bhulaiyaa/bhulaiya, Mohabbatein/mohabatein).
#   schwa: the inherent vowel deleted in speech but kept in a Sanskritised romanisation or marked with a halant in Devanagari (चुपके/chupake, सरफ़रोश/sarafarosh, ब्योमकेश/ब्योम्केश).
#   aspiration: aspirated and unaspirated stops swapped (फूल/पूल, छे/चे, घ/ग in सिंघम/सिंगम, ठ/ट in पठान/पटान, भ/ब, ख/क, ध/द).
#   retroflex: retroflex and dental consonants swapped (ट/त, ठ/थ, ड/द, ण/न), as regional speakers and English loans blur them (न्यूटन/न्यूतन, देव डी/देव दी).
#   nukta: the nukta dropped or added (ज़/ज, फ़/फ, क़/क, ख़/ख, ग़/ग, ड़/ड), so ज़ंजीर is written जंजीर and ग़दर गदर.
#   nasal: anusvara, chandrabindu and a written nasal consonant interchanged, or a nasal dropped (मैंने/मैने, शांति/शान्ति, मोहब्बतें/मोहब्बतेँ, जाऊंगा/जाऊँगा).
#   sibilant: श, ष and स swapped, as eastern and rural speakers merge them (शेरशाह/शेरसाह, श्री/सिरी, शक्तिमान/सक्तिमान).
#   vowel-length: short and long vowels swapped, the most frequent Hindi spelling error (दीवार/दिवार, पीकू/पिकु, ि/ी, ु/ू), and ऋ written रि (कृष/क्रिश).
#   v-w: व said and written as ब by eastern speakers (वीर/बीर, जवानी/जबानी), and v and w in romanised words.
#   english: English titles and loanwords written in Devanagari in several spellings (हाइवे/हाईवे, वेडनेसडे/वेनसडे, स्पाइडर/स्पायडर, द/दी/दि for the article, ऑ/ओ, ै/े).
#   code-mix: one request switching between Latin and Devanagari mid-title.
#   letters: initialisms said as letter names, in either script (केजीएफ/के जी एफ, आर आर आर, ट्रिपल आर, आर डी बर्मन).
#   number: digits, Devanagari digits (०-९), Hindi number words (दो, तीन, पंद्रह, चार सौ बीस), English number words in Devanagari (टू, सेवन) and ordinals (12th, बारहवीं, ट्वेल्थ).
#   split-merge: one word split into several or several merged (बाज़ीगर/बाज़ी गर, हीरामंडी/हीरा मंडी, मूसेवाला/मूसे वाला).
#   real-word: a more frequent word replaces the title word (कृष्णा for Krrish, सत्य for Satya, मशान for Masaan, शशांक for Shawshank, बेड for Bad, पंडा for Panda).
# Controls (exact titles as the recogniser writes them, Latin lower case, punctuation dropped), ambiguous requests (ask among the near neighbours), missing sequels (ask) and absent titles (not_found, including near misses that share words with library titles) keep the decision thresholds honest.
#
# Cases describe what a listener hears; don't change a case to suit an encoder's results, or the comparison stops meaning anything (see docs/src/content/docs/contributing/dependencies.md).
