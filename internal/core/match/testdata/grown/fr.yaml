# Grown set: testdata/grown holds corpora added on top of the original ones (asr_corpus.yaml and phonetic/), which stay untouched. TestASRCorpus and TestPhoneticEval score both sets and report them separately.
#
# French (fr-FR) phonetic evaluation corpus, second set, for TestPhoneticEval. Same schema as asr_corpus.yaml; cases are scored, not asserted, so there is no xfail.
#
# Libraries: real, well-known French films, series, artists, albums and songs (titles as published, with original release years), with near neighbours that share words, first names or franchise names (Le Gendarme, Trois couleurs, Les Trois Mousquetaires, Les Rivières pourpres as film and series, Michel Sardou / Michel Polnareff / Michel Berger, Léo Ferré / Jean Ferrat / Nino Ferrer, Christophe / Christophe Maé, Zaz / Zazie, Julien Clerc / Julien Doré) so a wrong play is possible.
#
# Cases: what a speech recogniser plausibly writes when a French speaker asks for the title. Mishearings are grouped under a comment naming the confusion class they model. The classes come from documented French spelling-to-sound ambiguity, the main source of word errors when a name is out of vocabulary or a homophone is more frequent:
# - silent: silent final consonants, plural -s/-x/-nt and the mute feminine -e (lettres muettes: sous-doués/sous-doué, Raphaëlle/Raphaël, Ferrat/Ferra).
# - e-acute: the /e/ series é/ée/er/ez/et/ai and ait/ais/était (bélier/bélié, Bergé, osez/osé, allumer/allumez).
# - nasal: nasal vowel spellings an/en/em, in/ain/ein/un, on/om (prénom/prénon, sentimentale/santimentale, ceinture/sainture).
# - vowel: o/au/eau/ô, è/ê/ai/ei/et, ill/y/ï and e read /a/ before mm (Lescaut/Lescot, discret/discrè, Mireille/Mireye, femme/famme).
# - h: silent h and h aspiré (Hippocrate/Ippocrate, Hardy/Ardi, Daho/Dao).
# - consonant: c/ç/s/ss/sc, g/j/ge, qu/k/c/ck, ch/sh, gn/ni, th/t and y/i in Greek spellings.
# - double: single versus double consonants (Polnareff/Polnaref, Navarro/Navaro).
# - real-word: substitution by a more frequent homophone or near-homophone word, including the homophones grammaticaux (comte/conte/compte, aile/elle, et/est, on/ont, c'est/sait, vie/l'avis, temps/tant, Clerc/clair).
# - liaison: liaison and elision consonants attached to the wrong word, and dropped or swapped articles (les zenfants, la ziza, comme habitude).
# - split: word splits and merges, dropped hyphens and apostrophes (super condriaque, papa outai, laile).
# - number: digits versus number words, ordinals, roman-free sequel numbers, abbreviations, initialisms and symbols (les 400 coups, 37 2, M. read as monsieur, h p i, & read as et).
# - foreign: foreign and anglicised names spelt as a French recogniser hears them, or French names spelt in English (playtime/plé taïme, Kaas/Kass, Booba/Bouba, dernière dance).
# - diacritic: accents dropped by the recogniser or text normalisation.
# - schwa: schwa deletion in fast speech (les p'tits mouchoirs, j'veux).
#
# Controls (the title as written, plus genuine ambiguity that must ask) and absent titles (not_found for titles not in the library, including near misses that share words or first names with library titles; ask for missing numbered sequels, as in the first French corpus) keep the decision thresholds honest.
#
# This corpus was written and frozen blind: no encoder or matcher evaluation was run, read or consulted while writing it. Changing it after seeing an encoder's results invalidates the comparison.
