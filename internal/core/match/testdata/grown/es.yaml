# Grown set: testdata/grown is a held-out set of corpora, kept apart from the original set (asr_corpus.yaml and phonetic/). TestASRCorpus and TestPhoneticEval score both sets and report them separately.
#
# Spanish (es) phonetic evaluation corpus, second set, for TestPhoneticEval. Same schema as asr_corpus.yaml; cases are scored, not asserted, so there is no xfail.
#
# Libraries: two suites of real, well-known Spanish-language titles (Spain, Mexico, Argentina, Chile, Colombia, Cuba, Puerto Rico) with their original release years. Suite one is film and television, suite two is music (artists, albums and songs). Each library deliberately carries near neighbours that share words, first names or franchise names (Torrente 1 to 3, Padre no hay más que uno 1 and 2, Tadeo Jones 1 and 2, Velvet and Velvet Colección, La casa de papel and Berlín, Rocío Jurado and Rocío Dúrcal, Los Rodríguez and La Mala Rodríguez, Fito Páez and Fito & Fitipaldis, Luis Miguel, Luis Fonsi and Juan Luis Guerra, Dani Martín, Vanesa Martín and Ricky Martin, Vivir así es morir de amor and Vivir mi vida, the album and the song both called Mediterráneo) so that a wrong play is possible.
#
# Cases: what a speech recogniser plausibly writes when a Spanish speaker asks for the title. Each mishearing sits under a comment naming the confusion class it models. The classes follow the orthography-to-sound ambiguities documented in the RAE and ASALE Ortografía de la lengua española (2010) and Nueva gramática, Fonética y fonología (2011), and in Hualde, The Sounds of Spanish (2005):
# - Betacism: b and v are one phoneme /b/ ([b] or [β]); w in loanwords also surfaces as /b/ or /gu/.
# - Silent h: h is never pronounced, so ASR adds or drops it freely, often producing a real word (ola/hola, echo/hecho).
# - Yeísmo: ll and y merge for most speakers (rallando/rayando, yerro/hierro); hie- and ye- coincide.
# - Seseo and ceceo: c before e/i, z and s merge to /s/ (seseo, Andalusia, Canaries, all of Latin America) or to /θ/ (ceceo).
# - Aspiration or loss of syllable-final s, which also deletes plural markers (los santos > lo santo).
# - Loss of intervocalic and final d (-ado > -ao, -ido > -ío, de > e, sociedad > sociedá), including titles that already carry the elision (Corazón partío, Chambao) and the hypercorrection that restores a d that is not there.
# - Jota: g before e/i and j are both /x/; English-trained recognisers also write j as h or y.
# - Velar spellings: /k/ as c, qu or k; /g/ before e/i as gu, and gu reduced to g or w.
# - Tap and trill: r and rr confused in writing.
# - Nasal assimilation: n before p/b is pronounced [m] and m before p is written n.
# - Consonant cluster reduction: cc > c, x > s before consonants, epenthetic e before s+consonant in loanwords (Ska > eska).
# - Letter names and digits: hache, ge, jota, ce, pe for single letters; digits, number words and years read out in full.
# - Foreign names and words spelled as a Spanish speaker says them (Bad Bunny > bad bani, Biutiful > beautiful, Raphael > Rafael, Kase.O > case o).
# - Word splits and merges, including resegmentations that produce real words (la que se avecina > la que sea vecina).
# - Real-word substitutions: the recogniser lands on a common word near the title word (cesto for Sesto, águila for Agila).
# - Diacritic, ñ and punctuation loss.
# Controls are exact titles. Ambiguous cases ask, naming the candidates that must be offered. Absent cases are titles not in the library: unrelated titles, near-miss titles that share words with a library title (not_found), and missing sequels of a franchise the library holds (ask, following the precedent of "torrente dos" in phonetic/es.yaml).
#
# Cases describe what a listener hears; don't change a case to suit an encoder's results, or the comparison stops meaning anything (see docs/src/content/docs/contributing/dependencies.md).
