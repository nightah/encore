# Grown set: testdata/grown is a held-out set of corpora, kept apart from the original set (asr_corpus.yaml and phonetic/). TestASRCorpus and TestPhoneticEval score both sets and report them separately.
#
# Dutch (nl-NL) phonetic evaluation corpus, second set, for TestPhoneticEval. Same schema as asr_corpus.yaml; cases are scored, not asserted, so there is no xfail. It adds two suites with their own libraries to the first Dutch set; no play case repeats a heard string from it, and some absent cases deliberately name titles from its library, which are not in these libraries.
#
# Libraries: real, well-known Dutch and Flemish films and series, English-language films and series that Dutch speakers ask for (with original release years), and Dutch and Flemish artists, albums and songs (albums and songs with their original years), with near neighbours that share words, first names or numbers (Soof and Soof 2, Bon Bini Holland and Bon Bini Holland 2, Het paard van Sinterklaas and Waar is het paard van Sinterklaas?, Ja zuster, nee zuster as both film and series, three Lord of the Rings films, Toy Story 1 to 3, Blade Runner and Blade Runner 2049, The Two Towers and Fawlty Towers, Kees & Co and Mees Kees, De Ridder and Michiel de Ruyter, World of Hurt as both album and song, Gerard Joling and Gerard Cox, Herman van Veen and Toon Hermans, Will Tura and Willeke Alberti, De Dijk and Frans Duijts) so a wrong play is possible.
#
# Cases: what a speech recogniser plausibly writes when a Dutch or Flemish speaker asks for the title. Each mishearing sits under a "class" comment naming the confusion it models. The classes are documented Dutch spelling-to-sound ambiguities and the errors ASR language models make when a name is out of vocabulary or a more frequent word sounds alike:
#   ij-ei: ij, ei and the old ey/eij spellings all write one diphthong (Van Speijk/Van Speik, Kopspijkers/kopspeikers, Trijntje/treintje, De Dijk/de deik).
#   au-ou: au and ou(w) write one diphthong, and English ow and aw are heard as it (Kauwboy/kouwboy, Douwe/Dauwe, Lee Towers/lee touwers, Fawlty Towers/fawlty touwers).
#   g-ch: g and ch are one velar fricative in the north, so final g is written ch and the reverse; the soft southern and Flemish g is heard as h (Jeugd/jeuchd, tegenwoordig/tegenwoordich, Riphagen/Riphachen, Het Goede Doel/het hoede doel, Gert/hert).
#   devoicing: final d and t sound alike, so d is written t and t is written d, and English final voiced consonants are devoiced (paard/paart, avond/avont, Walking Dead/walking det, drugs/druks).
#   v-f z-s: initial v and z are devoiced in the north and f and s voiced by hypercorrection (Vader/Fader, Zusje/susje, De zaak/de saak, Familie/vamilie, Focus/vocus).
#   sch: sch is sx at the start of a syllable and s in -isch and -sche, and English sh is written sj or sch (Medisch/medies, Schitt's/sjits, Sherlock/sjerlok, Shocking/sjokking).
#   vowel-length: long vowels written double in closed syllables and single in open ones, so the recogniser writes them single or double the wrong way, and doubled consonants after short vowels are dropped (Mees Kees/mes kes, paard/pard, Buuren/buren, Boom/bom, Pappie/papie, Petteflet/peteflet).
#   ui-eu-oe: the rounded vowels ui, eu, oe, uu and English oo and ou confused (Huis/heus, suiker/seuker, Jeroen/jerun, Duijts/deuts, Boer/buur, Hoover/hoever).
#   en: the final n of -en is not said in most of the Netherlands and Flanders (vrienden/vriende, huilen/huile, werken/werke, Rowwen/rowwe).
#   w-v: w and v swapped by Flemish, Surinamese and English-influenced speakers, and by hypercorrection (Witse/vitse, Westworld/vestworld, Will/vill, Twilight/tvilight, Vader/wader).
#   c-k-s: c read as k or s and ch as tsj in loans and names, and letters spelled out (café/kafee, Chernobyl/tsjernobyl, Focus/fokus, Krezip/crezip, Professor T./professor tee, Dossier K./dossier kaa).
#   diminutive: -je, -tje and -pje added, dropped or swapped for the Flemish and Brabant -ke and the colloquial -ie (Abeltje/abeltjes, Swiebertje/swiebertie, Zusje/zussie/zuske, Snollebollekes/snollebolletjes, Smurfenlied/smurfenliedje).
#   apostrophe: 't and 'n written as het and een or with the apostrophe dropped, and the English possessive and contraction apostrophes dropped ('t Hof van Commerce/het hof van commerce, 't Is/het is, Schitt's/schitts, Lil'/lil, Chef'Special/chef special).
#   compound: compounds and one-word names split or joined, hyphens dropped (Kopspijkers/kop spijkers, Achtste-groepers/achtstegroepers, Ghostbusters/ghost busters, Hooverphonic/hoover phonic, Welterusten/wel te rusten).
#   english: English titles as a Dutch recogniser writes them, with the to d or de, th to t, and English vowels in Dutch spelling (The Lion King/de laion king, Jurassic/joerassic, Peaky/pieky, Calm/kalm, Animals/enimels).
#   number: digits against words, Dutch numbers with units before tens (eenentwintig, negenenveertig), years read in hundreds, Dutch and English number words, & said as en, and the Dutch titles of English films (Toy Story 2/twee/two, 1917/negentien zeventien, 2049/tweeduizend negenenveertig, 28/achtentwintig, Se7en/zeven, The Two Towers/De Twee Torens, 3JS/drie jee es).
#   real-word: a more frequent real word replaces the title word (Ruyter/ruiter, Clown/kloon, Abeltje/appeltje, Kees/kaas, Dana Winner/Dana winnaar, Munnik/monnik, Typhoon/tyfoon, Duijts/Duits, Normaal/normal).
#   diacritic: diaeresis, grave and acute accents dropped (Tiësto/tiesto, Hèze/heze, café/cafe).
# Controls (exact titles as an ASR writes them, lower case, punctuation dropped), the distinctive opening words of a title (peaky for Peaky Blinders), ambiguous requests (ask among the near neighbours), missing sequels (ask) and absent titles (not_found, including near misses that share words with library titles) keep the decision thresholds honest.
#
# Cases describe what a listener hears; don't change a case to suit an encoder's results, or the comparison stops meaning anything (see docs/src/content/docs/contributing/dependencies.md).
