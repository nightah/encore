# Labelled ASR corpus for the matcher. Each suite is one library in one language; each case is what Alexa heard and what should happen.
#
# want: play (with id), ask (optionally with among: ids that must all be in the top candidates), or not_found.
# xfail documents a known miss: it counts against precision but doesn't fail the test, and the test fails if it starts passing.
# kinds restricts the query like Query.Kinds.
