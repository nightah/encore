# English utterance patterns, translated on Crowdin. Each key is one way of asking, and may hold several patterns, one per line. (a|b) picks one, [a|b] is optional, {Slot} is a slot. Built-in intents already understand the common phrasings; samples here only add Kodi-specific ones.
#
# "[(in|on) the {Room}]" lets a request name the room whose Kodi should play it.

