# French values for the custom slot types in model.yaml. IDs are what the handler acts on and match English; values and synonyms are what people say.
#
# Several types hold the verb itself (SEEK_DIRECTION "avance"/"recule", SUBTITLE_ACTION "active"/"désactive", POWER_ACTION "éteins") because French puts the action first: "avance de dix minutes", "désactive les sous-titres".

