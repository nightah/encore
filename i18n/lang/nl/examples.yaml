# Example values for the dynamic slot types in model.yaml (nl): deploys replace them with what is set up in Encore. Chosen for this language rather than translated, so not on Crowdin.

# Stand-in for AMAZON.SearchQuery in nl-NL: add-ons are read from Kodi when asked for, so these only bias what Alexa hears.
KODI_ADDON:
  - {value: youtube}
  - {value: netflix}
  - {value: npo}
  - {value: ondertitels}
  - {value: weer}
  - {value: spotify}

# Stand-in for AMAZON.SearchQuery in nl-NL: favourites are read from Kodi when asked for, so these only bias what Alexa hears.
KODI_FAVOURITE:
  - {value: npo start}
  - {value: radio veronica}
  - {value: het journaal}
  - {value: weerbericht}
  - {value: kinderliedjes}

KODI_MUSIC_VIDEO:
  - {value: bohemian rhapsody}
  - {value: dromen zijn bedrog}
  - {value: take on me}
  - {value: zoutelande}
  - {value: radar love}

# Examples only, extended from the library when available.
KODI_PLAYLIST:
  - {value: roadtrip, synonyms: [road trip, op reis]}
  - {value: feest, synonyms: [party, feestje]}
  - {value: sporten, synonyms: [workout, training]}
  - {value: chill, synonyms: [chill out, ontspannen]}
  - {value: kinderen, synonyms: [kids]}
  - {value: avondeten, synonyms: [diner]}
  - {value: best beoordeeld, synonyms: [favorieten, top]}

# Examples only: deploys replace them with the rooms set up in Encore. Utterances say "in de {Room}", "in het {Room}", "op de {Room}" or a bare "op {Room}" (as in "op zolder" or "op kantoor"), so values carry no article.
KODI_ROOM:
  - {value: woonkamer, synonyms: [huiskamer]}
  - {value: slaapkamer}
  - {value: kinderkamer}
  - {value: keuken}
  - {value: werkkamer, synonyms: [studeerkamer]}
  - {value: kantoor}
  - {value: eetkamer}
  - {value: logeerkamer}
  - {value: thuisbioscoop, synonyms: [bioscoop]}
  - {value: zolder}
  - {value: kelder}
  - {value: speelkamer}
  - {value: garage}

