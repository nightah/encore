# fr-FR inherits lang/fr.
# "encore" means "again" in French, so French uses "kodi" even when encore is chosen. "lecteur encore" was tried first, but Amazon's simulator never routed "ouvre lecteur encore" (or "lance", "démarre") to the skill.

invocation: kodi
language: fr
launch:
  also:
    - "lance {invocation}"
    - "démarre {invocation}"
  open: "ouvre {invocation}"
  skill: "ouvre la skill {invocation}"
skill_name: Encore
