# nl-NL inherits lang/nl. "encore" is a known loanword in Dutch (said for a concert's toegift), contains none of the launch words Amazon lists for Dutch ("start", "speel", "open", "vraag") and clashes with no Dutch Alexa command, so the invocation stays "encore".

invocation: encore
language: nl
launch:
  also:
    - "start {invocation}"
    - "begin {invocation}"
  open: "open {invocation}"
  plain_open_fails: true
  skill: "start de skill {invocation}"
skill_name: Encore
