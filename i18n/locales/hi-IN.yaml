# hi-IN inherits lang/hi. Amazon lets a hi-IN invocation name use English words written in lowercase Latin letters, and Indian speakers say brand names in English, so the invocation stays "encore", as in en-IN, and the "kodi" choice is written "kodi" rather than "कोडी".

invocation: encore
language: hi
launch:
  also:
    - "{invocation} खोलो"
    - "{invocation} चालू करो"
  open: "{invocation} शुरू करो"
  plain_open_fails: true
  skill: "{invocation} स्किल शुरू करो"
skill_name: Encore
