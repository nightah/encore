# es-MX inherits lang/es, which is written for Spain; this overlay adds what Mexican speakers say and replaces responses that sound Peninsular. Alexa uses tú in Mexico too. "encore" is not a Spanish word, so it doesn't clash with anything Alexa understands. es-US carries the same overlay, and adds unaccented samples; change both together.
#
# Utterances add "la rola" (a song), "la compu" and "la computadora" for the computer, "dale play", "en mi {Room}" ("en mi recámara", "en mi cuarto"), "quiero seguir viendo", "el capítulo nuevo", "cámbiale al canal", "qué pasan en" and "en vivo" for live TV. Responses use the preterite where Spain uses the perfect ("no encontré", not "no he encontrado"), "está bien" for "vale", "configuración" for "ajustes", "video" for "vídeo" and "cuarto" for "habitación". Times are read on the twelve-hour clock ("3:04 p. m."), so the end time follows "hora de término" rather than "a las", which would have to be "a la" at one o'clock, and comes before a semicolon or ends the response, since "p. m." already ends in a period; "hora de inicio" does the same for a start time.

invocation: encore
language: es
launch:
  also:
    - "inicia {invocation}"
  open: "abre {invocation}"
  skill: "abre la skill {invocation}"

